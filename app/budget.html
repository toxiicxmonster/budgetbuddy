<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Buddy</title>

<style>
:root{
  --bg:#f4f5f2;--surface:#fff;--surface2:#eef0ec;--text:#1c231f;--muted:#65706a;--border:#dde2dc;
  --accent:#2f7d6d;--accent-ink:#fff;--accent-soft:#e2f0ec;--neg:#b42318;--pos:#15803d;--warn:#a15c07;
  --warn-soft:#fdf3e1;--bar:#e5e9e4;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#111412;--surface:#1a1e1b;--surface2:#222824;--text:#e6ebe7;--muted:#99a49d;--border:#2d3430;
  --accent:#55b9a2;--accent-ink:#0b1310;--accent-soft:#1d3530;--neg:#f87171;--pos:#4ade80;--warn:#f5b84a;
  --warn-soft:#33290f;--bar:#2a312c;--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#111412;--surface:#1a1e1b;--surface2:#222824;--text:#e6ebe7;--muted:#99a49d;--border:#2d3430;
  --accent:#55b9a2;--accent-ink:#0b1310;--accent-soft:#1d3530;--neg:#f87171;--pos:#4ade80;--warn:#f5b84a;
  --warn-soft:#33290f;--bar:#2a312c;--shadow:none;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:4px 0 16px;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 10px}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.hwrap{max-width:1160px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
@media (max-width:420px){.brand{font-size:15px;gap:5px}.brand .logo{width:26px;height:26px}#themeBtn{min-width:30px!important;padding-left:6px;padding-right:6px}}
@media (max-width:400px){#addBtn{font-size:0;padding-left:11px;padding-right:11px}#addBtn::before{content:"＋";font-size:16px;line-height:1}}
.brand .logo{display:inline-flex;width:32px;height:32px}
.brand .logo svg{width:100%;height:100%}
.brand{letter-spacing:-.01em}
#status{flex:1;min-width:0;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hwrap{flex-wrap:nowrap}
#status.err{color:var(--neg);font-weight:600}
nav{max-width:1160px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;padding:10px 10px 9px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button:hover{color:var(--text)}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
#banner{display:none;background:var(--warn-soft);color:var(--warn);padding:8px 16px;font-size:13px;text-align:center}
main{max-width:1160px;margin:0 auto;padding:20px 16px 80px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:12.5px;color:var(--muted)}
.stat .val{font-size:22px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
select{max-width:100%}
.field{max-width:100%}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--neg)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:none;cursor:pointer;color:var(--muted);padding:3px 7px;border-radius:6px;font-size:15px}
.icon:hover{background:var(--surface2);color:var(--text)}
input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--border);border-radius:6px;background:none;cursor:pointer}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input.grow{flex:1 1 220px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.field>input,.field>select{color:var(--text);font-size:14.5px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.neg{color:var(--neg)}
.pos{color:var(--pos)}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl th.right,.tbl th.num{text-align:right}
.tbl th.sortable{cursor:pointer}
.tbl th.sortable:hover{color:var(--text)}
.tbl td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
table.tbl.wide{min-width:820px}
.tbl tr.uncat td{background:var(--warn-soft)}
.tbl tr.dayhead td{background:var(--surface2);padding:7px 10px;font-size:13px;border-bottom:0}
.tbl tr.dayhead td>span{float:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:520px){#status:not(.err){display:none}}
/* phones: transactions as a simple list (icon · name · amount, category underneath) */
@media (max-width:620px){
  .txcard .tablewrap{overflow:visible}
  .txcard table, .txcard tbody{display:block;width:100%}
  .txcard thead{display:none}
  .txcard tr:not(.dayhead){display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:2px 8px;padding:8px 4px;border-bottom:1px solid var(--border)}
  .txcard tr.dayhead{display:block}.txcard tr.dayhead td{display:block}
  .txcard tr:not(.dayhead) td{border:0;padding:0}
  .txcard tr:not(.dayhead) td:nth-child(1), .txcard tr:not(.dayhead) td:nth-child(2){display:none}
  .txcard tr:not(.dayhead) td:nth-child(3){grid-column:1}
  .txcard tr:not(.dayhead) td:nth-child(3) .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
  .txcard tr:not(.dayhead) td:nth-child(4){grid-column:1/-1;grid-row:2;padding-left:40px}
  .txcard tr:not(.dayhead) td:nth-child(4) select{width:100%;padding:4px 8px;font-size:13px}
  .txcard tr:not(.dayhead) td:nth-child(5){grid-column:2;grid-row:1;font-weight:600}
  .txcard tr:not(.dayhead) td:nth-child(6){grid-column:3;grid-row:1}
}
.tbl tr.dup td{opacity:.45}
.tbl tfoot td{font-weight:650;border-top:2px solid var(--border)}
.tbl td.click{cursor:pointer}
.tbl td.click:hover{background:var(--surface2)}
.desc{font-weight:500;word-break:break-word}
.sub{font-size:12px;color:var(--muted)}
.catsel{max-width:190px}
.pill{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-left:4px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none}
.cicon{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;margin-right:7px;flex:none;font-size:11.5px;line-height:1;background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 55%,transparent)}
.cicon.big{width:30px;height:30px;font-size:16px;margin-right:10px}
button.cicon{border:0;cursor:pointer;padding:0}
.iconpick{font-size:20px;padding:6px 0}.iconpick.on{outline:2px solid var(--accent)}
.brow{display:grid;grid-template-columns:minmax(170px,1.3fr) 2fr minmax(140px,auto) 96px;gap:12px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.brow:hover{background:var(--surface2)}
.bname{display:flex;align-items:center;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:9px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px}
.bnums{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bleft{font-size:12.5px;text-align:right;white-space:nowrap;color:var(--muted)}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{width:170px;height:170px;flex:none}
.dslice{cursor:pointer;stroke:var(--surface);stroke-width:1}
.dslice:hover{opacity:.85}
.dlbl{font-size:11px;fill:var(--muted)}.dval{font-size:17px;font-weight:650;fill:var(--text)}
.dlegend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:2px}
.dl{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;cursor:pointer;font-size:14px}
.dl:hover{background:var(--surface2)}
.dl .grow{flex:1;min-width:0}.dl .num{font-variant-numeric:tabular-nums}
.dl .pct{width:38px;text-align:right}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:12px}
@media (max-width:520px){.seg{grid-template-columns:1fr 1fr}}
.seg button{min-width:0;border:0;background:none;padding:8px 6px;border-radius:9px;font:inherit;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bigamt{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--accent);padding:4px 2px}
.bigamt span{font-size:28px;color:var(--muted)}
.bigamt input{border:0;background:none;font-size:34px;font-weight:650;width:100%;padding:4px 0;color:var(--text);outline:none;box-shadow:none}
.cattiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:236px;overflow:auto;padding:2px}
.ctile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit;font-size:12px;color:var(--text);text-align:center;line-height:1.2}
.ctile .cicon{margin:0}
.ctile:hover{background:var(--surface2)}
.ctile.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);background:var(--accent-soft)}
.setb{color:var(--accent);font-weight:600;text-decoration:none;border-bottom:1px dashed currentColor}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cwd{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cday{min-height:78px;border:1px solid var(--border);border-radius:9px;padding:4px;display:flex;flex-direction:column;gap:3px;background:var(--surface);min-width:0}
.cday.out{border:0;background:none}
.cday.past{background:var(--surface2)}
.cday.today{border:2px solid var(--accent)}
.cnum{font-size:12px;color:var(--muted);font-weight:600}
.cchip{font-size:11px;line-height:1.25;padding:2px 5px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--surface2)}
.cchip.paid{background:var(--accent-soft);color:var(--text)}
.cchip.due{background:var(--warn-soft);color:var(--text)}
.cchip.late{background:color-mix(in srgb,var(--neg) 16%,transparent);color:var(--neg)}
.cchip.pay{background:none;color:var(--pos);font-weight:600;cursor:default;padding-left:0}
@media (max-width:620px){.cday{min-height:46px;padding:2px;gap:2px}.cday .cchip:not(.pay){font-size:0;height:7px;padding:0;border-radius:4px}.cday .cchip.paid{background:var(--pos)}.cday .cchip.due{background:var(--warn)}.cday .cchip.late{background:var(--neg)}.cchip.pay{font-size:0}.cchip.pay::before{content:"💵";font-size:12px}.cwd{font-size:10px}.calhead h2{font-size:17px}.calhead .calsum{order:9;flex-basis:100%}}
.list-item.recent{cursor:pointer;border-radius:8px;padding-left:4px;padding-right:4px}
.list-item.recent:hover{background:var(--surface2)}
.news{display:flex;flex-direction:column;gap:12px}
.newsrow{display:flex;gap:12px;align-items:flex-start}
.newsrow .ni{font-size:20px;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);flex:none}
.calc-foot{margin-right:auto;font-size:14px;color:var(--muted)}.calc-foot b{font-size:18px;margin-left:6px}
.bcov{grid-column:1/-1;margin:-8px 0 0 16px;font-size:12px;color:var(--muted);white-space:normal}
@media (max-width:620px){.brow{grid-template-columns:1fr auto}.brow .bar{grid-column:1/-1;grid-row:2}.bleft{display:none}}
.period{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.period select{font-weight:600;font-size:15px}
.drop{display:block;border:2px dashed var(--border);border-radius:12px;padding:36px 16px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:16px;font-weight:600;margin-bottom:6px}
.bulk{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.bulk.on{display:flex}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px}
.note.info{background:var(--accent-soft);color:var(--text)}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.steps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.steps .card{margin:0}
.steps .card>b{display:block;font-size:15px;margin-bottom:4px}
.list-item{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{max-width:820px}
.mhead{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.mhead h2{margin:0;flex:1}
.mbody{padding:16px 18px;max-height:65vh;overflow-y:auto}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border);flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.form label.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px}
.form label>input,.form label>select{color:var(--text);font-size:14.5px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,24px);opacity:0;visibility:hidden;background:var(--text);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;display:flex;gap:10px;align-items:center;z-index:60;transition:transform .2s,opacity .2s,visibility .2s;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.icon svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon:disabled{opacity:.3;cursor:default}
.icon.danger:hover{color:var(--neg)}
.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.chart .axis-text{fill:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.col,.chart .col.hl{filter:brightness(1.12)}
.chart-legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:-4px 0 8px;flex-wrap:wrap}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.chart-legend i.line{width:14px;height:2px;border-radius:1px}
#tip{position:fixed;pointer-events:none;z-index:70;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.15);display:none;min-width:150px}
#tip .t{color:var(--muted);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .r b{font-variant-numeric:tabular-nums}
#tip .k{display:inline-block;width:12px;height:2px;margin-right:6px;vertical-align:middle}
.bill{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--border)}
.bill .amt{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.bill:last-child{border-bottom:0}
.bill .when{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap}
.status.paid{background:var(--accent-soft);color:var(--accent)}
.status.due{background:var(--surface2);color:var(--muted)}
.status.late{background:var(--warn-soft);color:var(--warn)}
.alloc{display:flex;height:14px;gap:2px;margin:6px 0 12px}
.alloc span{border-radius:3px;min-width:3px}

<script>
'use strict';
/* ============================== helpers ============================== */
const V = document.getElementById('view');
const PALETTE = ['#2f7d6d','#3b6fd8','#d9822b','#c2410c','#7c3aed','#0891b2','#be185d','#65a30d','#ca8a04','#dc2626','#4f46e5','#0d9488','#9333ea','#ea580c','#64748b','#16a34a','#0369a1','#a16207'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function median(a){ const s = a.slice().sort((x, y) => x - y); return s.length ? s[Math.floor(s.length / 2)] : 0; }
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const round2 = n => Math.round(n * 100) / 100;
function today(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function addDays(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function daysBetween(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 864e5); }
function fmtDate(s, withYear = true){
  if (!s) return '';
  return new Date(s + 'T00:00:00Z').toLocaleDateString(undefined, {month:'short', day:'numeric', year: withYear ? 'numeric' : undefined, timeZone:'UTC'});
}
function rangeLabel(a, b){
  const sameYear = a.slice(0, 4) === b.slice(0, 4);
  return fmtDate(a, !sameYear) + ' – ' + fmtDate(b);
}
let FMT = null;
function fmt(n){
  if (!FMT) { try { FMT = new Intl.NumberFormat(undefined, {style:'currency', currency: S.settings.currency || 'USD'}); } catch(e) { FMT = new Intl.NumberFormat(undefined, {style:'currency', currency:'USD'}); } }
  return FMT.format(n || 0);
}
function download(name, text, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], {type}));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

const svgI = d => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const IC = {
  edit: svgI('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>'),
  trash: svgI('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
  up: svgI('<path d="M12 19V5M6 11l6-6 6 6"/>'),
  down: svgI('<path d="M12 5v14M6 13l6 6 6-6"/>'),
  close: svgI('<path d="M6 6l12 12M18 6L6 18"/>'),
};
const iconBtn = (ic, title, onclick, extra = '', disabled = false) => `<button class="icon ${extra}" title="${title}" aria-label="${title}" onclick="${onclick}"${disabled ? ' disabled' : ''}>${IC[ic]}</button>`;

/* ---------- tooltip + column chart ---------- */
function showTip(e, html){
  const t = document.getElementById('tip'); t.innerHTML = html; t.style.display = 'block';
  const r = t.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip(){ const t = document.getElementById('tip'); if (t) t.style.display = 'none'; }
const CHARTS = {};
/** Column chart: one series of bars, optional per-bar marker (e.g. income) and a reference line (e.g. budget). */
function chartSlot(id, cfg){ CHARTS[id] = cfg; return `<div class="chart" id="${id}"></div>`; }
function niceStep(v){ if (v <= 0) return 25; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function drawCharts(){
  for (const id in CHARTS) {
    const el = document.getElementById(id); if (!el) { delete CHARTS[id]; continue; }
    const c = CHARTS[id], W = Math.max(220, el.clientWidth), H = c.height || 200;
    const padL = 54, padR = 8, padT = 10, padB = 26, iw = W - padL - padR, ih = H - padT - padB;
    const vals = c.items.flatMap(it => [it.value, it.marker || 0]).concat(c.ref || 0);
    const top0 = Math.max(...vals, 1), step = niceStep(top0 / 4), max = step * Math.max(1, Math.ceil(top0 / step)), y = v => padT + ih - Math.max(0, v) / max * ih;
    const band = iw / c.items.length, bw = Math.min(24, band * 0.6);
    const ticks = []; for (let t = 0; t <= max + 1e-9; t += step) ticks.push(t);
    const short = v => v >= 1000 ? +(v / 1000).toFixed(2) + 'k' : String(+v.toFixed(2));
    const sym = fmt(0).replace(/[\d.,\s]/g, '').slice(0, 2) || '$';
    let s = ticks.map(t => `<line class="grid-line" x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-text" x="${padL - 8}" y="${y(t) + 4}" text-anchor="end">${sym}${short(t)}</text>`).join('');
    const every = Math.ceil(c.items.length / Math.max(1, Math.floor(iw / 64)));
    c.items.forEach((it, i) => {
      const cx = padL + band * i + band / 2, x = cx - bw / 2, top = y(it.value), h = padT + ih - top;
      const r = Math.min(4, h);
      const path = h > 0 ? `M${x},${padT + ih}V${top + r}Q${x},${top} ${x + r},${top}H${x + bw - r}Q${x + bw},${top} ${x + bw},${top + r}V${padT + ih}Z` : '';
      s += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${ih}"/>`;
      s += `<path class="col" d="${path}" style="fill:${it.color || c.color}" ${it.dim ? 'opacity=".45"' : ''} pointer-events="none"/>`;
      if (it.marker) s += `<line x1="${cx - bw / 2 - 5}" x2="${cx + bw / 2 + 5}" y1="${y(it.marker)}" y2="${y(it.marker)}" style="stroke:${c.markerColor}" stroke-width="2" stroke-linecap="round" pointer-events="none"/>`;
      if ((i % every === 0 && c.items.length - 1 - i >= every * 0.75) || i === c.items.length - 1) s += `<text class="axis-text" x="${cx}" y="${H - 6}" text-anchor="middle">${esc(it.short)}</text>`;
    });
    if (c.ref) s += `<line x1="${padL}" x2="${W - padR}" y1="${y(c.ref)}" y2="${y(c.ref)}" style="stroke:${c.refColor}" stroke-width="2" stroke-dasharray="0" pointer-events="none"/>`;
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(c.label || '')}">${s}</svg>`;
    el.querySelectorAll('.hit').forEach(h => {
      const it = c.items[+h.dataset.i];
      h.onpointermove = e => showTip(e, c.tip(it));
      h.onpointerleave = hideTip;
      if (c.onClick) h.onclick = () => { hideTip(); c.onClick(it); };
    });
  }
}
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(drawCharts, 120); });

/* ============================== state & storage ============================== */
let S, MODE = 'local', DATA_PATH = '', saveTimer = null, saving = false;

function defaultState(){
  const cats = [
    ['c_rent','Rent / Mortgage','expense'],['c_util','Utilities','expense'],['c_phone','Phone & Internet','expense'],
    ['c_groc','Groceries','expense'],['c_dining','Dining Out','expense'],['c_gas','Gas & Transport','expense'],
    ['c_ins','Insurance','expense'],['c_subs','Subscriptions','expense'],['c_shop','Shopping','expense'],
    ['c_ent','Entertainment','expense'],['c_health','Health','expense'],['c_personal','Personal Care','expense'],
    ['c_debt','Debt Payments','expense'],['c_gifts','Gifts & Donations','expense'],['c_misc','Misc','expense'],
    ['c_income','Income','income'],['c_save','Savings','transfer'],['c_transfer','Transfers','transfer']];
  return {
    version: 1,
    settings: {currency: 'USD'},
    categories: cats.map((c, i) => ({id:c[0], name:c[1], kind:c[2], color:PALETTE[i % PALETTE.length]})),
    transactions: [], paychecks: [], budget: {}, trackers: [], bills: [], goals: [], debts: [], accounts: [], imports: [], importProfiles: {},
    months: {}, billOverrides: {}, startMonth: '',
    rules: [
      {id:uid(), match:'payroll|direct dep|dir dep', categoryId:'c_income', paycheck:true},
      {id:uid(), match:'netflix|spotify|hulu|disney+|youtube premium|apple.com/bill', categoryId:'c_subs'},
      {id:uid(), match:'shell oil|exxon|chevron|sunoco|speedway|circle k|wawa|marathon petro|uber trip|lyft', categoryId:'c_gas'},
      {id:uid(), match:'doordash|uber eats|grubhub|mcdonald|starbucks|chick-fil-a|taco bell|wendy|chipotle|dunkin', categoryId:'c_dining'},
      {id:uid(), match:'kroger|aldi|safeway|publix|trader joe|whole foods|wegmans|food lion|h-e-b', categoryId:'c_groc'},
      {id:uid(), match:'online transfer|payment thank you|autopay payment|automatic payment - thank', categoryId:'c_transfer'},
    ],
  };
}
function migrate(d){
  const base = defaultState();
  if (!d || typeof d !== 'object') return base;
  for (const k of Object.keys(base)) if (d[k] === undefined) d[k] = base[k];
  d.settings = Object.assign({currency:'USD'}, d.settings);
  if (Array.isArray(d.importProfiles)) d.importProfiles = {};
  // Older data: create accounts from transaction account names, and give each import its statement month
  for (const n of [...new Set(d.transactions.map(t => t.account).filter(Boolean))])
    if (!d.accounts.some(a => a.name.toLowerCase() === n.toLowerCase())) d.accounts.push({id:'a_' + uid(), name:n, bank:'', type:/card|visa|credit/i.test(n) ? 'credit' : /sav/i.test(n) ? 'savings' : 'checking'});
  for (const i of d.imports) {
    if (!i.accountId) { const a = d.accounts.find(x => x.name === i.account); if (a) i.accountId = a.id; }
    if (!i.month) { const c = {}; d.transactions.filter(t => t.importId === i.id).forEach(t => { const k = t.date.slice(0, 7); c[k] = (c[k] || 0) + 1; }); i.month = Object.entries(c).sort((a, b) => b[1] - a[1])[0]?.[0] || (i.date || '').slice(0, 7); }
  }
  for (const g of d.goals) {
    if (!g.type) g.type = /emergenc/i.test(g.name) ? 'emergency' : /vacation|trip|travel/i.test(g.name) ? 'sinking' : /401|403/i.test(g.name) ? 'k401' : /roth/i.test(g.name) ? 'roth' : /ira/i.test(g.name) ? 'ira' : /hsa/i.test(g.name) ? 'hsa' : 'savings';
    if (typeof g.match === 'string') { g.matchText = g.match; g.match = 0; }
  }
  return d;
}
/* ---------- optional password protection: AES-256-GCM, key from PBKDF2-SHA256 ---------- */
let KEY = null, SALT = null, PW = null, LOCKED = null; // LOCKED = encrypted file waiting for a password; PW kept in memory only while unlocked
const CAN_ENCRYPT = !!(window.crypto && crypto.subtle);
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const isEncrypted = o => o && typeof o === 'object' && o.pocketBudgetEncrypted === 1;
async function deriveKey(password, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function encryptText(text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = await crypto.subtle.encrypt({name:'AES-GCM', iv}, KEY, new TextEncoder().encode(text));
  return JSON.stringify({pocketBudgetEncrypted:1, v:1, salt:b64(SALT), iv:b64(iv), data:b64(data)});
}
/** Returns the decrypted state, or throws if the password is wrong. Sets KEY/SALT on success. */
async function decryptWith(obj, password){
  const salt = unb64(obj.salt), key = await deriveKey(password, salt);
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(obj.iv)}, key, unb64(obj.data));
  return {text:new TextDecoder().decode(plain), key, salt};
}
async function decryptFile(obj, password){
  const r = await decryptWith(obj, password);
  const state = JSON.parse(r.text);
  KEY = r.key; SALT = r.salt; PW = password;
  return state;
}
/** What gets written to disk / exported: encrypted when a password is set. */
async function serialize(){ const t = JSON.stringify(S); return KEY ? encryptText(t) : t; }

async function load(){
  let raw = null;
  if (location.protocol.startsWith('http')) {
    try {
      const r = await fetch('api/data', {cache:'no-store'});
      if (r.ok) {
        MODE = 'server';
        raw = await r.text();
        try { DATA_PATH = (await (await fetch('api/info')).json()).dataFile; } catch(e) {}
      }
    } catch(e) { /* fall through to browser storage */ }
  }
  if (MODE !== 'server') { try { raw = localStorage.getItem('pocketBudget'); } catch(e) {} }
  let obj = null;
  try { obj = raw && raw.trim() ? JSON.parse(raw) : null; } catch(e) { obj = null; }
  if (isEncrypted(obj)) { LOCKED = obj; S = null; return; }
  S = obj ? migrate(obj) : defaultState();
}
/* ---------- theme: auto (follow Windows) / light / dark, remembered on this computer ---------- */
const THEMES = {auto:['🌓', 'Theme: follows Windows'], light:['☀️', 'Theme: light'], dark:['🌙', 'Theme: dark']};

/* ---------- undo: snapshots of the last 30 saved states (memory only) ---------- */
let UNDO = [], LAST = null;
function resetUndo(){ UNDO = []; LAST = JSON.stringify(S); }
function save(){
  const now = JSON.stringify(S);
  if (LAST !== null && LAST !== now) { UNDO.push(LAST); if (UNDO.length > 30) UNDO.shift(); }
  LAST = now;
  clearTimeout(saveTimer);
  setStatus('Saving…');
  saveTimer = setTimeout(doSave, 350);
}
function undo(){
  if (!UNDO.length) { toast('Nothing to undo.'); return; }
  S = migrate(JSON.parse(UNDO.pop())); LAST = JSON.stringify(S);
  PI = null; F.sel.clear(); closeModal();
  clearTimeout(saveTimer); setStatus('Saving…'); saveTimer = setTimeout(doSave, 350);
  render(); toast('Undone.' + (UNDO.length ? '' : ' (nothing more to undo)'));
}
/** Toast with an Undo button — use after changes people might regret. */
const doneUndo = msg => toast(msg, 'Undo', undo);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && S) { e.preventDefault(); undo(); }
});

try {

  bc.onmessage = e => { if (e.data === 'hello') { bc.postMessage('here'); warn(); } else if (e.data === 'here') warn(); };
  bc.postMessage('hello');

async function doSave(){
  saveTimer = null; saving = true;
  let body;
  try { body = await serialize(); } catch(e) { setStatus('⚠ Could not encrypt — not saved', true); saving = false; return; }
  if (MODE === 'server') {
    try {
      const r = await fetch('api/data', {method:'POST', headers:{'Content-Type':'application/json','X-Budget':'1'}, body});
      if (!r.ok) throw new Error(r.status);
      setStatus('All changes saved to drive ✓');
    } catch(e) { setStatus('⚠ Not saved — is the “Budget Buddy” window still open?', true); }
  } else {
    try { localStorage.setItem('pocketBudget', body); setStatus('Saved in this browser'); }
    catch(e) { setStatus('⚠ Could not save — export a backup!', true); }
  }
  saving = false;
}
window.addEventListener('beforeunload', e => { if (saveTimer || saving) { e.preventDefault(); e.returnValue = ''; } });

/** A short, human merchant name pulled from a messy bank description. */
const NICE_NAMES = {circlek:'Circle K', 'amazon.com':'Amazon', 'amazon prime':'Amazon Prime', 'walmart.com':'Walmart', mcdonalds:"McDonald's", 'chick-fil-a':'Chick-fil-A', 'affirm.com paym':'Affirm payment', 'apple.com/bill':'Apple', 'wm supercenter':'Walmart', vzwrlss:'Verizon', 'vzw':'Verizon', 'trump account':'Trump Account', 'mi lot-kroger':'Kroger', kfc:'KFC', 'kfc c':'KFC', 'dfcu online':'Online transfer', 'funds transfer':'Online transfer', ihop:'IHOP', cvs:'CVS'};
function displayName(desc){
  const raw = String(desc || '').trim();
  let s = raw.replace(/^(E |POS |ATM )?(WITHDRAWAL|DEPOSIT)\s*-\s*/i, '');
  if (/^(via |bill$|debt$)/i.test(s) || s.length < 3) return raw.replace(/\s+-\s+/g, ' ');           // nothing more specific to show
  s = s.replace(/^(SQ|TST|PP|PAYPAL) ?\*/i, '');
  const words = s.split(/\s+/), out = [];
  for (const w of words) { if (out.length && (/\d/.test(w) || /^#/.test(w))) break; out.push(w.replace(/#.*$/, '').replace(/[*]+$/, '')); }
  let n = out.join(' ').replace(/[\s,]+(INC|LLC|CO|CORP)\.?$/i, '').replace(/\s+[A-Z]{2}US$/, '').replace(/\s*-\s*$/, '').trim();
  n = n.replace(/\*[A-Za-z0-9]{1,3}\b/g, '').trim();
  const lo = n.toLowerCase(), known = NICE_NAMES[lo] || NICE_NAMES[lo.split(' ')[0]] || NICE_NAMES[lo.split('*')[0]] || NICE_NAMES[lo.split(' ').slice(0, 2).join(' ')];
  if (known) return known;
  if (n === n.toUpperCase() && /[A-Z]/.test(n)) n = n.toLowerCase().replace(/(^|[\s\-\/(&])([a-z])/g, (m, a, b) => a + b.toUpperCase()).replace(/'S\b/g, "'s");
  return n || raw;
}
function merchantKey(desc){
  const raw = String(desc || '').toUpperCase();
  let s = raw.replace(/^(E |POS |ATM )?(WITHDRAWAL|DEPOSIT)\s*-\s*/, '');
  for (let i = 0; i < 3; i++) s = s.replace(/^(ZELLE PAYMENT TO|ZELLE TO|ONLINE PAYMENT TO|BILL ?PAY(MENT)? TO|PAYMENT TO|POS|DEBIT|CHECKCARD|CHECK CARD|PURCHASE|DBT|ACH|CARD|VISA|RECURRING|SQ ?\*|TST ?\*|PAYPAL ?\*|PP ?\*)\s*/, '');
  s = s.replace(/[#*]/g, ' ').replace(/\d[\d\-\/:.]*/g, ' ').replace(/\s+/g, ' ').trim();
  const words = s.split(' ').filter(w => w && w !== '-');
  const two = words.slice(0, 2).join(' ');
  if (two && raw.includes(two)) return two;
  return words[0] || raw.slice(0, 14).trim();
}
const ruleTerms = r => String(r.match || '').toLowerCase().split('|').map(x => x.trim()).filter(Boolean);
const ruleAmountOk = (r, t) => { const a = Math.abs(+t.amount || 0); return !(r.over != null && a <= r.over) && !(r.upTo != null && a > r.upTo); };
const ruleAmountLabel = r => r.over != null ? 'over ' + fmt(r.over) : r.upTo != null ? fmt(r.upTo) + ' or less' : '';
const ruleMatches = (r, t) => { const d = String(t.desc).toLowerCase(); return ruleTerms(r).some(k => d.includes(k)) && ruleAmountOk(r, t); };
const matchRule = t => S.rules.find(r => r.categoryId && ruleMatches(r, t));
/** merchant → {category: count}, from transactions you've already sorted (splits excluded). */
function learnedMap(){
  const m = {};
  for (const t of S.transactions) if (t.category && !(t.splits && t.splits.length)) { const k = merchantKey(t.desc) + (t.amount > 0 ? '+' : '-'); (m[k] ||= {})[t.category] = (m[k][t.category] || 0) + 1; }
  return m;
}
/** The category you've used for this merchant before — only when you've been consistent (≥ 75% of the time). */
function learnedCat(m, t){
  const c = m[merchantKey(t.desc) + (t.amount > 0 ? '+' : '-')]; if (!c) return '';
  const total = Object.values(c).reduce((a, b) => a + b, 0), [best, n] = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
  return n / total >= 0.75 && catOf(best) ? best : '';
}

/** A paycheck you entered by hand (same amount, within 3 days) that this deposit is. */
const typedPaycheckFor = t => t.amount > 0 ? S.paychecks.find(p => !p.txnId && Math.abs(+p.amount - t.amount) < 1 && Math.abs(daysBetween(p.date, t.date)) <= 3) : null;
/** Money moved between your own accounts (not spending): "Funds Transfer", "Online Transfer to…", "XFER"… */
const looksLikeTransfer = d => /\b(funds?\s+tran|online\s+tran|mobile\s+tran|transfer\s+(to|from)|internal\s+tran|xfer|account\s+transfer|savings\s+transfer|share\s+transfer|cu\s+transfer)/i.test(d);
/** A payment received on a credit card's own statement ("CAPITAL ONE MOBILE PYMT", "PAYMENT - THANK YOU"): money moved from checking, not income. */
const looksLikeCardPayment = (d, acc) => !!acc && acc.type === 'credit' && /\b(pymt|payment|autopay)\b/i.test(d);
const looksLikePayroll = d => /\b(payroll|direct\s*dep|dir\s*dep|salary)\b/i.test(d);
/** The card category whose totals you type in for this account (e.g. account "DFCU Checking" ↔ category "DFCU card"). */
function acctCardCat(acc){
  if (!acc) return null;
  if (acc.cardCat) return catOf(acc.cardCat) || null;
  const generic = new Set(['card', 'checking', 'savings', 'account', 'bank', 'credit', 'union']);
  const w = new Set(descWords(acc.name + ' ' + (acc.bank || '')).filter(x => !generic.has(x)));
  const hits = cardCats().filter(c => descWords(c.name).some(x => !generic.has(x) && w.has(x)));
  return hits.length === 1 ? hits[0] : null;
}
/** Card totals you typed in that this statement now lists purchase by purchase. */
function totalsItemized(items, acc){
  const c = acctCardCat(acc); if (!c || !items.length) return {cat:c, list:[]};
  const d = items.map(x => x.date).sort();
  return {cat:c, list: S.transactions.filter(t => isManual(t) && t.category === c.id && t.amount < 0 && t.date >= d[0] && t.date <= d[d.length - 1])};
}
/** Remember how a typed-in entry was before a statement set it aside, so undoing the import restores it. */
/** A learned category for a line on this account's statement. A purchase learned as another card's ("DFCU card") belongs to this account's card instead. */
function learnedCatFor(L, t, acc){
  const lc = learnedCat(L, t); if (!lc || !isCardCat(catOf(lc))) return lc;
  const own = acctCardCat(acc); return own ? own.id : '';
}
function setAside(m, importId){ if (m.replacedBy) return; m.replacedBy = importId; m.origCategory = m.category; m.origNote = m.note || ''; }
const impAcct = () => IMP.accountId ? acctById(IMP.accountId) : {name: IMP.newAcct ? IMP.newAcct.name : IMP.account, bank: IMP.newAcct ? IMP.newAcct.bank : ''};
function addPaycheckFromTx(t){
  if (S.paychecks.some(p => p.txnId === t.id)) return false;
  // Link to a manually-entered paycheck of the same amount within 3 days instead of double counting.
  const twin = typedPaycheckFor(t);
  if (twin) { twin.txnId = t.id; twin.typed = true; }
  else S.paychecks.push({id:uid(), date:t.date, amount:t.amount, source:merchantKey(t.desc), note:'', txnId:t.id});
  const c = catOf(t.category);
  if (!c || c.kind !== 'income') t.category = incomeCatId();
  return true;
}
function applyRule(r, scope){
  let n = 0;
  for (const t of S.transactions) {
    if (!ruleMatches(r, t) || (t.splits && t.splits.length)) continue;
    if (scope === 'all' || !t.category) { if (t.category !== r.categoryId) { t.category = r.categoryId; n++; } }
    if (r.paycheck && t.amount > 0) addPaycheckFromTx(t);
  }
  return n;
}

/* ---------- months: the budget runs on calendar months ---------- */
const monthKey = d => d.slice(0, 7);
const monthStart = k => k + '-01';
const monthEnd = k => { const [y, m] = k.split('-').map(Number); return addDays(m === 12 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`, -1); };
const monthName = k => new Date(k + '-01T00:00:00Z').toLocaleDateString(undefined, {month:'long', year:'numeric', timeZone:'UTC'});
const nextMonth = k => monthKey(addDays(monthEnd(k), 1));
function monthPeriod(k){ const e = monthEnd(k); return {mode:'month', key:k, start:monthStart(k), end:e, estEnd:e, open: today() >= monthStart(k) && today() <= e, label:monthName(k)}; }
/** Every month from your first transaction (or paycheck / statement) through this month. */
function getPeriods(){
  const dates = S.transactions.map(t => t.date).concat(S.paychecks.map(p => p.date), (S.imports || []).map(i => i.month ? i.month + '-01' : '')).filter(Boolean).sort();
  if (!dates.length) return [];
  const last = monthKey(dates[dates.length - 1] > today() ? dates[dates.length - 1] : today());
  const out = [];
  for (let k = monthKey(dates[0]); k <= last; k = nextMonth(k)) out.push(monthPeriod(k));
  return out;
}
/** When the next paycheck should land, from the usual gap between past paychecks. */
function nextPayday(){
  if (S.settings.pay && S.settings.pay.anchor) return payDates(today(), addDays(today(), 40))[0] || null;
  const ds = [...new Set(S.paychecks.map(p => p.date))].sort();
  if (ds.length < 2) return null;
  const gap = median(ds.slice(1).map((d, i) => daysBetween(ds[i], d)));
  let n = addDays(ds[ds.length - 1], gap);
  while (n < today()) n = addDays(n, gap);
  return gap > 0 ? n : null;
}
function currentIdx(P){
  const t = today();
  const i = P.findIndex(p => t >= p.start && t <= p.end);
  return i >= 0 ? i : P.length - 1;
}
function periodByStart(start){ return getPeriods().find(p => p.start === start); }
function periodStats(p){
  const linked = linkedSet();
  const tx = S.transactions.filter(t => t.date >= p.start && t.date <= p.end);
  const byCat = {}; let spent = 0, uncat = 0, otherIn = 0;
  for (const t of tx) {
    for (const pt of parts(t)) {
      const a = partSpend(pt);
      if (a) { const k = pt.category || ''; byCat[k] = (byCat[k] || 0) + a; spent += a; }
    }
    if (isUncat(t)) uncat++;
    const c = catOf(t.category);
    if (c && c.kind === 'income' && t.amount > 0 && !linked.has(t.id)) otherIn += t.amount;
  }
  const pays = S.paychecks.filter(x => x.date >= p.start && x.date <= p.end);
  let income = pays.reduce((s, x) => s + (+x.amount || 0), 0);
  income += otherIn;
  // Bills on autopay to a credit card: they're part of that card's total, so count them in their own category
  // and take them out of the card's "other charges" (never counting the money twice).
  const autopay = {};
  for (const b of S.bills) for (const due of billDates(b, p.start, p.end)) {
    const k = monthKey(due); if (!autopayApplies(b, k)) continue;
    const A = billFor(b, k).amount, terms = termsOf(b.match || b.name);
    (autopay[b.paidWith] ||= []).push({bill:b, due, amount:A});
    if (!tx.some(t => t.date >= monthStart(k) && t.date <= monthEnd(k) && terms.some(w => t.desc.toLowerCase().includes(w)))) { byCat[b.categoryId || ''] = (byCat[b.categoryId || ''] || 0) + A; spent += A; }
  }
  for (const card in autopay) {
    const A = autopay[card].reduce((s, x) => s + x.amount, 0), cut = Math.min(Math.max(0, byCat[card] || 0), A);
    if (cut) { byCat[card] -= cut; spent -= cut; }
  }
  return {tx, byCat, spent, uncat, income, pays, otherIn, autopay};
}
function totalBudget(){ return S.categories.filter(c => c.kind === 'expense').reduce((s, c) => s + (+S.budget[c.id] || 0), 0); }

/* ---------- trackers ---------- */
const trackerTerms = tr => String(tr.keywords || '').toLowerCase().split(/[,|]/).map(x => x.trim()).filter(Boolean);
function trackerMatch(tr, t){
  const kw = trackerTerms(tr);
  if (!kw.length && !tr.categoryId) return false;
  if (tr.categoryId && !parts(t).some(p => p.category === tr.categoryId)) return false;
  if (kw.length) { const d = (t.desc + ' ' + (t.note || '')).toLowerCase(); if (!kw.some(k => d.includes(k))) return false; }
  return true;
}
/** Amount of a matched transaction that counts toward a tracker (only the matching split part when filtered by category). */
function trackerSpend(t, tr){
  return parts(t).filter(p => !tr || !tr.categoryId || p.category === tr.categoryId)
    .reduce((s, p) => { const c = catOf(p.category); return s + (c && c.kind === 'income' ? 0 : -p.amount); }, 0);
}
function trackerTotal(tr, p){
  let total = 0, count = 0;
  for (const t of S.transactions) if (t.date >= p.start && t.date <= p.end && trackerMatch(tr, t)) { total += trackerSpend(t, tr); count++; }
  return {total, count};
}

/* ---------- transfers between your own accounts ---------- */
/** Pairs like "PAYMENT TO CARD -600" (checking) + "PAYMENT THANK YOU +600" (card) within 5 days. */
function findTransferPairs(){
  const isTransfer = t => { const c = catOf(t.category); return c && c.kind === 'transfer'; };
  const linked = linkedSet();
  const pool = S.transactions.filter(t => !(t.splits && t.splits.length) && !linked.has(t.id) && t.account);
  const pos = {};
  for (const t of pool) if (t.amount > 0) (pos[t.amount.toFixed(2)] ||= []).push(t);
  const used = new Set(), pairs = [];
  for (const out of pool.filter(t => t.amount < 0).sort((a, b) => a.date.localeCompare(b.date))) {
    const cands = (pos[(-out.amount).toFixed(2)] || []).filter(x => !used.has(x.id) && x.account !== out.account && Math.abs(daysBetween(out.date, x.date)) <= 5);
    if (!cands.length) continue;
    const inn = cands.sort((a, b) => Math.abs(daysBetween(out.date, a.date)) - Math.abs(daysBetween(out.date, b.date)))[0];
    used.add(inn.id); used.add(out.id);
    if (!(isTransfer(out) && isTransfer(inn))) pairs.push([out, inn]);
  }
  return pairs;
}
function transferCatId(){ return (S.categories.find(c => c.id === 'c_transfer') || S.categories.find(c => c.kind === 'transfer') || {}).id || ''; }
function showTransfers(){
  const pairs = findTransferPairs();
  if (!pairs.length) { toast('No unmatched transfers between your accounts found.'); return; }
  openModal('Money moved between your accounts', `<p class="muted small" style="margin-top:0">These look like the same money leaving one account and arriving in another (for example a credit card payment). Marking them as <b>Transfers</b> stops them being counted as spending or income.</p>
    ${pairs.map(([o, i], n) => `<label class="list-item" style="cursor:pointer;align-items:flex-start"><input type="checkbox" class="tp" value="${n}" checked style="margin-top:4px">

  }).join('');

  const trackRows = S.trackers.map(tr => { const r = trackerTotal(tr, p); return `<div class="list-item" style="cursor:pointer" onclick="showTrackerTx('${tr.id}','${p.start}')"><div class="grow">${esc(tr.name)} <span class="muted small">× ${r.count}</span></div><div class="num">${fmt(r.total)}</div></div>`; }).join('');
  const merch = {};

  const top = Object.entries(merch).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const incomeSrc = [...new Set(st.pays.map(x => x.source || 'Paycheck'))].map(esc).join(', ') + (st.otherIn ? (st.pays.length ? ' + ' : '') + 'other deposits' : '');

/**
 * Things worth knowing right now (current month only): bills due soon / not seen, budgets running out early,
 * unusually large purchases, subscription price increases, and the next paycheck.
 * Each alert has a key so it can be dismissed for this month.
 */
function headsUp(p, st, bills){
  const t0 = today(), out = [];
  const daysTo = d => daysBetween(t0, d);
  for (const x of bills) {
    if (x.paid) continue;
    const d = daysTo(x.due);
    if (d < 0 && d >= -10) out.push({key:'late:' + x.bill.id + x.due, icon:'⚠', level:'warn', text:`<b>${esc(x.bill.name)}</b> (${fmt(x.amount)}) was due ${fmtDate(x.due, false)} — no payment seen yet.`, hint:'Paid it? It will show once you import the statement.'});
    else if (d >= 0 && d <= 5) out.push({key:'due:' + x.bill.id + x.due, icon:'⏰', level:'info', text:`<b>${esc(x.bill.name)}</b> ${fmt(x.amount)} is due ${d === 0 ? '<b>today</b>' : d === 1 ? 'tomorrow' : 'in ' + d + ' days'} (${fmtDate(x.due, false)}).`});
  }
  {
    const total = daysBetween(p.start, p.end) + 1, left = Math.max(0, daysBetween(t0, p.end) + 1), elapsed = 1 - left / total;
    const billCats = new Set(S.bills.map(x => x.categoryId).filter(Boolean));
    const cov = coverMap();
    for (const c of S.categories.filter(c => c.kind === 'expense' && !cov[c.id])) {
      const b = groupBudget(c), sp = groupSpent(c, st);
      if (!b || !sp) continue;
      if (sp - b < Math.max(1, b * 0.01)) { if (sp >= b || billCats.has(c.id)) continue; } // within rounding, or a fixed bill that's simply been paid
      if (sp > b && goodWhenOver(c.id)) {
        const bal = monthBalance(p);
        out.push(bal >= 0
          ? {key:'extra:' + c.id, icon:'🎉', level:'info', text:`Nice work — you paid <b>${fmt(sp - b)} extra</b> toward ${c.id === debtCatId() ? 'your debt' : esc(c.name)} this month, and you're still ${fmt(bal)} in the green.`, go:`showTx({cat:'${c.id}',period:'${p.start}'})`}
          : {key:'extraneg:' + c.id, icon:'⚠', level:'warn', text:`You paid <b>${fmt(sp - b)} extra</b> toward ${c.id === debtCatId() ? 'debt' : esc(c.name)}, but it leaves the month <b>${fmt(-bal)} below zero</b>. Extra payments are great once the month's covered.`, go:`showTx({cat:'${c.id}',period:'${p.start}'})`});
      }
      else if (sp > b) out.push({key:'over:' + c.id, icon:'⚠', level:'warn', text:`<b>${esc(c.name)}</b> is over budget by ${fmt(sp - b)} (${fmt(sp)} of ${fmt(b)}).`, go:`showTx({cat:'${c.id}',period:'${p.start}'})`});
      else if (sp >= b * 0.8 && elapsed < 0.7) out.push({key:'pace:' + c.id, icon:'⚠', level:'warn', text:`<b>${esc(c.name)}</b>: ${Math.round(sp / b * 100)}% of the monthly budget used with ${left} day${left === 1 ? '' : 's'} still to go — ${fmt(b - sp)} left.`, go:`showTx({cat:'${c.id}',period:'${p.start}'})`});
    }
    const np = nextPayday(), nd = np ? daysBetween(t0, np) : -1;
    if (nd >= 0 && nd <= 2) out.push({key:'pay:' + np, icon:'💵', level:'info', text:`Next paycheck expected ${nd === 0 ? 'today' : nd === 1 ? 'tomorrow' : 'in 2 days'} (${fmtDate(np, false)}).`});
    // Statements: last month's statement not imported yet for an account you normally import
    const lastK = monthKey(addDays(p.start, -1));
    for (const a of missingStatements(lastK)) out.push({key:'stmt:' + a.name + lastK, icon:'📄', level:'info', text:`No ${monthName(lastK)} statement imported yet for <b>${esc(a.name)}</b>${a.bank ? ' (' + esc(a.bank) + ')' : ''}.`, go:`go('import')`, btn:'Import'});
  }
  // Unusually large purchases: at least $100 and 4× the typical purchase in that category.
  const typical = {};
  for (const t of S.transactions) if (t.amount < 0 && !(t.splits && t.splits.length)) (typical[t.category || ''] ||= []).push(-t.amount);
  for (const t of st.tx) {
    if (t.amount >= 0 || (t.splits && t.splits.length) || spendOf(t) <= 0) continue;
    const arr = typical[t.category || ''] || [];
    if (arr.length >= 5 && -t.amount >= Math.max(100, median(arr) * 4))
      out.push({key:'big:' + t.id, icon:'💸', level:'info', text:`Large purchase: <b>${fmt(-t.amount)}</b> at ${esc(merchantKey(t.desc))} on ${fmtDate(t.date, false)} — your usual ${esc(catName(t.category))} purchase is about ${fmt(median(arr))}.`, go:`editTx('${t.id}')`});
  }
  for (const r of findRecurring()) if (r.priceUp != null && daysBetween(r.last, t0) <= 35)
    out.push({key:'price:' + r.key + r.last, icon:'▲', level:'warn', text:`<b>${esc(r.name)}</b> went up from ${fmt(r.priceUp)} to ${fmt(r.amount)} (about ${fmt((r.amount - r.priceUp) * r.yearly / r.typical)} more a year).`, go:`go('bills')`});
  // Backup reminder: everything lives on one USB drive
  if (S.transactions.length) {
    const lb = S.settings.lastFullBackup, ago = lb ? daysBetween(lb, t0) : null;
    if (ago == null || ago > 30) out.push({key:'backup:' + monthKey(t0), icon:'💾', level:'warn', text: ago == null ? `You haven't made a full backup yet. If this USB drive is lost, your budget goes with it.` : `Your last full backup was ${ago} days ago.`, hint:'Saves a .zip to your Downloads folder — keep it on your computer or a cloud drive.', go:'fullBackup()', btn:'Back up now'});
  }
  // Debts: part of the minimum paid → remaining due (or past due)
  for (const d of S.debts.filter(d => debtBalance(d) > 0)) {
    const ds = debtMonthStatus(d, p);
    if (ds.state === 'partial' || (ds.state === 'unpaid' && ds.pastDue && !S.bills.some(b => b.id === d.billId))) {
      if (ds.pastDue) out.push({key:'pastdue:' + d.id + p.key, icon:'⚠', level:'warn', text:`<b>${esc(d.name)}</b>: ${fmt(ds.remaining)} of the ${fmt(ds.min)} minimum is <b>past due</b>${ds.due ? ` (was due ${fmtDate(ds.due, false)})` : ''}.`, go:`openCalc()`, btn:'Pay it'});
      else if (!ds.due || daysBetween(t0, ds.due) <= 7) out.push({key:'partdue:' + d.id + p.key, icon:'⏰', level:'info', text:`<b>${esc(d.name)}</b>: ${fmt(ds.paid)} paid — <b>${fmt(ds.remaining)} still due</b> ${ds.due ? 'by ' + fmtDate(ds.due, false) : 'this month'}.`, go:`openCalc()`, btn:'Plan it'});
    }
  }
  const dis = S.settings.dismissed || {};
  return out.filter(a => !dis[a.key + '|' + p.start]);
}
function dismissAlert(key, start){ (S.settings.dismissed ||= {})[key + '|' + start] = today(); save(); render(); }
function headsUpCard(list, p){
  if (!list.length) return '';
  window._alerts = list;
  return `<div class="card heads"><h2>Heads-up <span class="muted small" style="font-weight:400">· ${list.length}</span></h2>
    ${list.map((a, i) => `<div class="alert ${a.level}"><span class="ai" aria-hidden="true">${a.icon}</span>
      <div class="grow">${a.text}${a.hint ? `<div class="sub">${a.hint}</div>` : ''}</div>
      ${a.go ? `<button class="btn small" onclick="${a.go}">${a.btn || 'View'}</button>` : ''}
      ${iconBtn('close', 'Dismiss for this month', `dismissAlert(window._alerts[${i}].key,'${p.start}')`)}</div>`).join('')}</div>`;
}

/* ---------- Quick sort: categorize uncategorized transactions one at a time, keyboard-friendly ---------- */
let QS = null; // {ids, i, done, filter, visible}
/** What Quick sort goes through by default: the month you're working on and later (closed months and old history stay out). */
const qsQueue = () => { const from = monthStart(openMonth()); return S.transactions.filter(t => isUncat(t) && t.date >= from); };
function quickSort(periodStart){
  const p = periodStart ? periodByStart(periodStart) : null;
  const ids = (p ? S.transactions.filter(t => isUncat(t) && t.date >= p.start && t.date <= p.end) : qsQueue()).sort((a, b) => b.date.localeCompare(a.date)).map(t => t.id);
  if (!ids.length) { toast('Nothing to sort — every transaction has a category ✓'); return; }
  QS = {ids, i:0, done:0, filter:''};
  drawQS();
}
function qsCurrent(){
  while (QS.i < QS.ids.length) { const t = txById(QS.ids[QS.i]); if (t && isUncat(t)) return t; QS.i++; }
  return null;
}
function qsCats(t){
  const sug = learnedCat(learnedMap(), t) || (matchRule(t) || {}).categoryId || '';
  const use = {}; S.transactions.forEach(x => { if (x.category) use[x.category] = (use[x.category] || 0) + 1; });
  const score = c => (c.id === sug ? 1e6 : 0) + ((t.amount > 0) === (c.kind !== 'expense') ? 1e4 : 0) + (use[c.id] || 0);
  const f = QS.filter.trim().toLowerCase();
  return {sug, cats: S.categories.filter(c => !f || c.name.toLowerCase().includes(f)).sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name))};
}
function drawQS(){
  const t = qsCurrent();
  if (!t) {
    openModal('Quick sort', `<div style="text-align:center;padding:20px"><div style="font-size:40px">🎉</div><h2>All sorted!</h2><p class="muted">You categorized ${QS.done} transaction${QS.done === 1 ? '' : 's'}.</p></div>`,
      `<button class="btn primary" onclick="closeModal()">Done</button>`);
    return;
  }
  const key = merchantKey(t.desc), kl = key.toLowerCase();
  const similar = S.transactions.filter(x => x !== t && isUncat(x) && x.desc.toLowerCase().includes(kl)).length;
  const hasRule = S.rules.some(r => ruleTerms(r).includes(kl));
  const remaining = QS.ids.slice(QS.i).filter(id => { const x = txById(id); return x && isUncat(x); }).length;
  openModal(`Quick sort <span class="muted small" style="font-weight:400">· ${remaining} left</span>`, `
    <div class="sub">${fmtDate(t.date)}${t.account ? ' · ' + esc(t.account) : ''}</div>
    <div class="qs-desc">${esc(displayName(t.desc))}</div>${displayName(t.desc) !== t.desc ? `<div class="sub">${esc(t.desc)}</div>` : ''}
    <div style="font-size:22px;font-weight:650;margin:4px 0 12px" class="${t.amount > 0 ? 'pos' : ''}">${t.amount > 0 ? '+' : ''}${fmt(t.amount)}</div>
    <input id="qsFilter" placeholder="Type to find a category…" value="${esc(QS.filter)}" oninput="QS.filter=this.value;drawQSCats()" style="width:100%">
    <div class="qs-cats" id="qsCats"></div>
    <div class="mt" style="display:flex;flex-direction:column;gap:6px">
      ${similar ? `<label class="check" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="qsSim" checked> Also sort the ${similar} other “${esc(key)}” transaction${similar === 1 ? '' : 's'} the same way</label>` : ''}
      ${hasRule ? '' : `<label class="check" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="qsRule" ${similar ? 'checked' : ''}> Remember “${esc(key)}” for future imports</label>`}
    </div>
    <div class="muted small mt">Keys: <kbd>1</kbd>–<kbd>9</kbd> pick · <kbd>Enter</kbd> first match · <kbd>→</kbd> skip · <kbd>←</kbd> back · <kbd>Esc</kbd> stop</div>`,
    `<button class="btn left" onclick="qsMove(-1)" ${QS.i ? '' : 'disabled'}>← Back</button>
     <button class="btn" onclick="editTx('${t.id}')">Split or edit…</button>
     <button class="btn" onclick="qsMove(1)">Skip →</button>`, true);
  drawQSCats();
}
function drawQSCats(){
  const t = qsCurrent(); if (!t) return;
  const {sug, cats} = qsCats(t);
  QS.visible = cats.map(c => c.id);
  document.getElementById('qsCats').innerHTML = cats.map((c, i) => `<button class="${c.id === sug ? 'sug' : ''}" onclick="qsPick('${c.id}')" title="${c.id === sug ? 'Suggested' : ''}">
      ${catBadge(c)}<span>${esc(c.name)}${c.id === sug ? ' <span class="muted small">· suggested</span>' : ''}</span>${i < 9 ? `<kbd>${i + 1}</kbd>` : ''}</button>`).join('')
    || '<div class="muted small">No category matches.</div>';
}
function qsPick(catId){
  const t = qsCurrent(); if (!t) return;
  const kl = merchantKey(t.desc).toLowerCase();
  const sim = document.getElementById('qsSim'), rule = document.getElementById('qsRule');
  t.category = catId; delete t.splits; QS.done++;
  if (sim && sim.checked) for (const x of S.transactions) if (isUncat(x) && x.desc.toLowerCase().includes(kl)) { x.category = catId; QS.done++; }
  if (rule && rule.checked) S.rules.unshift({id:uid(), match:kl, categoryId:catId, paycheck:false});
  save(); QS.i++; QS.filter = ''; drawQS();
}
function qsMove(d){
  if (d < 0) { // step back to the previous transaction, even if already sorted, so it can be changed
    if (QS.i === 0) return;
    QS.i--; const t = txById(QS.ids[QS.i]); if (t && !isUncat(t)) { t.category = ''; delete t.splits; save(); }
  } else QS.i++;
  QS.filter = ''; drawQS();
}
document.addEventListener('keydown', e => {
  if (e.key === 'n' && !e.ctrlKey && !e.altKey && !e.metaKey && S && document.body.classList.contains('ready') && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && !document.getElementById('modal').classList.contains('on')) { e.preventDefault(); addAmount('', ''); }
});
const GO_KEYS = {m:['dash', 'Month'], s:['sheet', 'Monthly Sheet'], b:['budget', 'Budget'], i:['bills', 'Bills'], d:['goals', 'Savings & Debt'], p:['pay', 'Income'], t:['tx', 'Transactions'], r:['reports', 'Reports']};
let GO_PENDING = 0;

/**
 * A debt's minimum for one month: how much is paid, what's left, when it's due, and whether that's passed.
 * state: 'none' (no minimum) · 'paid' · 'partial' (some paid) · 'unpaid'.
 */
function debtMonthStatus(d, p){
  const min = +d.minPayment || 0;
  const byName = entriesIn(p, t => t.amount < 0 && t.desc.toLowerCase().includes(d.name.toLowerCase().split(' (')[0])).reduce((s, t) => s - t.amount, 0);
  const paid = round2(Math.max(debtPaidIn(d, p), byName));
  const due = d.dueDay ? `${p.key}-${pad(Math.min(d.dueDay, +p.end.slice(8)))}` : '';
  const remaining = round2(Math.max(0, min - paid));
  if ((d.paidMonths || []).includes(p.key) && remaining > 0.004) return {min, paid, due, remaining:0, state:'paid', pastDue:false, extra:0, marked:true}; // you said it's paid
  const state = !min ? 'none' : remaining <= 0.004 ? 'paid' : paid > 0 ? 'partial' : 'unpaid';
  const pastDue = remaining > 0.004 && today() > (due || p.end);
  return {min, paid, due, remaining, state, pastDue, extra: round2(Math.max(0, paid - min))};
}
function debtStatusHTML(ds){
  if (ds.state === 'none') return ds.paid ? `${fmt(ds.paid)} paid` : '';
  if (ds.marked) return `<span class="status paid">✓ Minimum paid</span><div class="sub">marked paid</div>`;
  if (ds.state === 'paid') return `<span class="status paid">✓ Minimum paid</span>${ds.extra > 0.004 ? `<div class="sub pos">+${fmt(ds.extra)} extra</div>` : ''}`;
  if (ds.pastDue) return `<span class="status late">${fmt(ds.remaining)} past due</span>${ds.paid ? `<div class="sub">${fmt(ds.paid)} paid</div>` : ''}`;
  if (ds.state === 'partial') return `<span class="status due">${fmt(ds.remaining)} remaining</span><div class="sub">${fmt(ds.paid)} paid · due ${ds.due ? fmtDate(ds.due, false) : 'this month'}</div>`;
  return `<span class="status due">due ${ds.due ? fmtDate(ds.due, false) : 'this month'}</span>`;
}
/**
 * The month against the budget: what's left in budgeted categories (a card's line includes what it covers),

function budgetLeft(st){
  const cov = coverMap(); let budget = 0, spentIn = 0, outside = 0;
  for (const c of S.categories.filter(c => c.kind === 'expense' && !cov[c.id])) {
    const b = groupBudget(c), sp = groupSpent(c, st);
    if (b > 0) { budget += b; spentIn += goodWhenOver(c.id) ? Math.min(sp, b) : sp; } else outside += sp;   // extra paid toward debt/savings isn't "over"
  }
  outside += st.byCat[''] || 0;
  return {budget:round2(budget), spentIn:round2(spentIn), outside:round2(outside), left:round2(budget - spentIn)};
}

/* ---------- No double counting between typed-in amounts and imported statements ---------- */
const STOP_WORDS = new Set(['the','and','payment','pymt','online','card','debit','credit','purchase','ach','autopay','auto','bill','thank','you','web','pos','transfer','from','for','inc','llc','com','www','recurring','pmt','epay','paid']);
// common bank abbreviations → the name people type
const NAME_ALIASES = {amzn:'amazon', amazn:'amazon', vzw:'verizon', vzwrlss:'verizon', wm:'walmart', wmt:'walmart', 'wal':'walmart', mcd:'mcdonalds', mcdonald:'mcdonalds', tgt:'target', cvs:'cvs', sq:'', tst:'', pp:'paypal', ebay:'ebay', att:'att', tmobile:'tmobile', geico:'geico', prog:'progressive', usaa:'usaa', dfcu:'dfcu', cap:'capital', capone:'capital'};
const descWords = s => String(s || '').toLowerCase().replace(/[^a-z ]+/g, ' ').split(/\s+/).map(w => NAME_ALIASES[w] !== undefined ? NAME_ALIASES[w] : w).filter(w => w.length >= 3 && !STOP_WORDS.has(w));
/** 0–1: are two descriptions roughly the same? (shared word = 1, same word start like "AMZN"/"Amazon" = .8, else letter-pair overlap) */
function nameSimilar(a, b){
  const wa = descWords(a), wb = descWords(b);
  if (wa.some(x => wb.includes(x))) return 1;
  if (wa.some(x => wb.some(y => x.length >= 4 && y.length >= 4 && x.slice(0, 4) === y.slice(0, 4)))) return 0.8;
  if (wa.some(x => wb.some(y => Math.min(x.length, y.length) >= 3 && (x.startsWith(y) || y.startsWith(x))))) return 0.8;
  const bg = s => { s = String(s).toLowerCase().replace(/[^a-z]/g, ''); const o = new Set(); for (let i = 0; i < s.length - 1; i++) o.add(s.slice(i, i + 2)); return o; };
  const A = bg(wa.join(' ')), B = bg(wb.join(' ')); let inter = 0; A.forEach(x => { if (B.has(x)) inter++; });
  return A.size + B.size ? 2 * inter / (A.size + B.size) : 0;
}
/**
 * How strongly a typed-in entry and a statement line look like the same payment. The amount must match exactly.
 * A clear name link (shared word, same bill, same category) allows dates up to 10 days apart;
 * a name that's only roughly the same allows a day or few (≤ 3 days).
 */
function twinScore(manual, imp){
  const days = Math.abs(daysBetween(manual.date, imp.date));
  // Typed-in amounts often carry a rough date (the bill's due day, or the 1st/15th from the sheet), so the same
  // calendar month also counts — but then only with a clear name link.
  const sameMonth = monthKey(manual.date) === monthKey(imp.date);
  if (Math.abs(Math.abs(manual.amount) - Math.abs(imp.amount)) >= 0.005 || (days > 10 && !sameMonth)) return 0;   // amount must match exactly
  let s = 0, named = false;
  const impText = imp.desc + ' ' + (imp.account || '') + ' ' + ((acctByName(imp.account) || {}).bank || '');
  const iw = new Set(descWords(impText));
  if (descWords(manual.desc + ' ' + catName(manual.category)).some(w => iw.has(w))) { s += 2; named = true; }
  const bill = S.bills.find(b => termsOf(b.match || b.name).some(k => manual.desc.toLowerCase().includes(k)));
  if (bill && termsOf(bill.match || bill.name).some(k => imp.desc.toLowerCase().includes(k))) { s += 3; named = true; }
  if (days > 10 && !named) return 0;
  if (manual.category && imp.category && manual.category === imp.category) s += 2;
  if (s < 2 && days <= 3 && nameSimilar(manual.desc, impText) >= 0.5) s += 2;   // roughly the same name, a day or so apart
  if (Math.sign(manual.amount) === Math.sign(imp.amount)) s += 0.5;
  return s - Math.min(days, 10) / 20;
}
/** The typed-in entry this statement line is a copy of, if any. */
function manualTwin(imp, taken){
  let best = null, bestS = 1.99;
  for (const m of S.transactions) {
    if (!isManual(m) || m === imp || taken.has(m.id) || (m.splits && m.splits.length)) continue;
    const sc = twinScore(m, imp); if (sc > bestS) { best = m; bestS = sc; }
  }
  return best;
}
/** A statement line that already covers this typed-in amount, if any. */
function importedTwin(manual){
  let best = null, bestS = 1.99;
  for (const t of S.transactions) { if (isManual(t)) continue; const sc = twinScore(manual, t); if (sc > bestS) { best = t; bestS = sc; } }
  return best;
}

/** "Give every dollar a job": this month's income split into bills, savings, extra debt, everyday budget and what's left. */
/**
 * "Where it went": spending by category as a donut (part-to-whole at a glance), top 5 + Other so it never has more than 6 slices.
 * A card that covers categories counts as itself (that's where the money was paid). Identity is never color alone: icon + name + amount in the legend.
 */
function whereItWent(p, st){
  const rows = Object.entries(st.byCat).filter(([, v]) => v > 0.004).map(([id, v]) => ({id, v, c:catOf(id)})).sort((a, b) => b.v - a.v);
  const total = rows.reduce((s, r) => s + r.v, 0);
  if (!rows.length || total <= 0) return '';
  const top = rows.slice(0, 5), rest = rows.slice(5), other = rest.reduce((s, r) => s + r.v, 0);
  const segs = top.map(r => ({id:r.id, name:r.c ? r.c.name : 'Uncategorized', v:r.v, color:r.c ? r.c.color : 'var(--muted)', icon:catBadge(r.c)}));
  if (other > 0.004) segs.push({id:'', name:`Other (${rest.length})`, v:other, color:'var(--bar)', icon:'<span class="cicon" style="--c:var(--muted)">•••</span>', other:rest.map(r => (r.c ? r.c.name : 'Uncategorized') + ' ' + fmt(r.v)).join('<br>')});
  const R = 70, r0 = 46, cx = 80, cy = 80, gap = segs.length > 1 ? 0.012 : 0; // ~2px surface gap between slices
  let a = -Math.PI / 2;
  const arc = (a0, a1) => { const big = a1 - a0 > Math.PI ? 1 : 0, P = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)} ${(cy + rad * Math.sin(ang)).toFixed(2)}`;
    return `M${P(R, a0)} A${R} ${R} 0 ${big} 1 ${P(R, a1)} L${P(r0, a1)} A${r0} ${r0} 0 ${big} 0 ${P(r0, a0)} Z`; };
  const paths = segs.map((g, i) => { const sweep = g.v / total * Math.PI * 2, a0 = a + gap / 2, a1 = a + Math.max(sweep - gap / 2, gap / 2 + 0.001); a += sweep;
    const tip = esc(`<div class="t">${esc(g.name)}</div><div class="r"><span>${fmt(g.v)}</span><b>${Math.round(g.v / total * 100)}%</b></div>${g.other ? `<div class="sub">${g.other}</div>` : ''}`);
    return segs.length === 1 ? `<circle cx="${cx}" cy="${cy}" r="${(R + r0) / 2}" fill="none" stroke="${g.color}" stroke-width="${R - r0}"></circle>`
      : `<path d="${arc(a0, a1)}" fill="${g.color}" class="dslice" onpointermove="showTip(event, this.dataset.tip)" onpointerleave="hideTip()" data-tip="${tip}" ${g.id ? `onclick="showTx({cat:'${g.id}',period:'${p.start}'})"` : ''}><title>${esc(g.name)} ${fmt(g.v)}</title></path>`; }).join('');
  return `<div class="card"><h2>Where it went</h2>
    <div class="donut"><svg viewBox="0 0 160 160" role="img" aria-label="Spending by category, ${fmt(total)} total">${paths}
      <text x="80" y="76" text-anchor="middle" class="dlbl">Spent</text><text x="80" y="95" text-anchor="middle" class="dval">${fmt(total).replace(/\.\d\d$/, '')}</text></svg>
      <div class="dlegend">${segs.map(g => `<div class="dl"${g.id ? ` onclick="showTx({cat:'${g.id}',period:'${p.start}'})"` : ''}>${g.icon}<span class="grow">${esc(g.name)}</span><span class="num">${fmt(g.v)}</span><span class="muted small pct">${Math.round(g.v / total * 100)}%</span></div>`).join('')}</div></div></div>`;
}
function monthPlan(p, st, bills){
  if (p.open) st = {...st, income: plannedIncome(p)}; // this month: count paychecks still to come
  const billsTot = bills.reduce((s, b) => s + b.amount, 0);
  const saveTot = S.goals.reduce((s, g) => s + planSaving(g), 0);
  const debtX = S.debts.some(d => debtBalance(d) > 0) ? +S.settings.debtExtra || 0 : 0;
  const billCats = new Set(S.bills.map(b => b.categoryId).filter(Boolean));
  const everyday = S.categories.filter(c => c.kind === 'expense' && !billCats.has(c.id)).reduce((s, c) => s + (+S.budget[c.id] || 0), 0);
  const left = round2(st.income - billsTot - saveTot - debtX - everyday);
  const nSave = S.goals.filter(g => planSaving(g)).length;
  const segs = [['Bills due this month', billsTot, 'var(--s1)', `${bills.length} bill${bills.length === 1 ? '' : 's'}`, 'bills'],
    ['Savings', saveTot, 'var(--s2)', `${nSave} account${nSave === 1 ? '' : 's'}`, 'goals'],
    ['Extra debt payment', debtX, 'var(--s3)', 'from your payoff plan', 'goals'],
    ['Everyday budget', everyday, 'var(--s4)', 'groceries, gas, fun…', 'budget']].filter(x => x[1] > 0);
  if (!segs.length) return `<div class="card"><h2>Monthly plan</h2><div class="muted small">Add <a href="#" onclick="go('bills');return false">bills</a>, <a href="#" onclick="go('goals');return false">savings</a> and a <a href="#" onclick="go('budget');return false">budget</a> to see how this month's income gets divided up.</div></div>`;
  const total = Math.max(st.income, segs.reduce((s, x) => s + x[1], 0));
  return `<div class="card"><h2>Monthly plan</h2>
    <div class="muted small" style="margin-top:-6px">How ${fmt(st.income)} of ${p.open && monthPaydays(p.key).some(d => !d.rec) ? 'expected ' : ''}income in ${p.label} is meant to be used.</div>
    <div class="alloc" role="img" aria-label="Income split">${segs.map(x => `<span style="flex:${x[1] / total};background:${x[2]}" title="${x[0]}: ${fmt(x[1])}"></span>`).join('')}${left > 0 ? `<span style="flex:${left / total};background:var(--bar)" title="Not assigned: ${fmt(left)}"></span>` : ''}</div>
    <div class="plan-row"><span class="k"></span><span class="grow">Income</span><b class="num">${fmt(st.income)}</b></div>
    ${segs.map(x => `<div class="plan-row" style="cursor:pointer" onclick="go('${x[4]}')"><span class="k" style="background:${x[2]}"></span><span class="grow">${x[0]} <span class="muted small">${x[3]}</span></span><span class="num">−${fmt(x[1])}</span></div>`).join('')}
    <div class="plan-row total"><span class="k" style="background:${left >= 0 ? 'var(--bar)' : 'var(--neg)'}"></span><span class="grow">${left >= 0 ? 'Not assigned yet' : 'Short by'}</span><span class="num ${left < 0 ? 'neg' : ''}">${fmt(Math.abs(left))}</span></div>
    <div class="muted small mt">${left < 0 ? '⚠ The plan needs more than this month’s income. Trim a budget or save a little less this month.' : left > 0 ? 'Give it a job — put it toward savings or your budget.' : 'Every dollar has a job. ✓'}${p.open ? ' Income may still grow as more paychecks arrive.' : ''}</div></div>`;
}

function undoImport(id){

  if (rec && rec.archive) deleteArchive(rec.archive);

const niceName = key => key.replace(/\b\w+/g, w => w[0] + w.slice(1).toLowerCase()).replace(/\.Com\b/g, '.com');
/** Is this merchant already one of your bills? */
const isBillKey = key => S.bills.some(b => termsOf(b.match || b.name).some(h => key.toLowerCase().includes(h) || h.includes(key.toLowerCase())));
/**
 * Recurring charges: same merchant, steady amount (±25%), at a steady rhythm (weekly / every 2 weeks / monthly / yearly),
 * seen at least 3 times. Also notes price increases and charges that seem to have stopped.
 */
function findRecurring(){
  const groups = {};
  for (const t of S.transactions) {
    if (t.amount >= 0 || (t.splits && t.splits.length)) continue;
    const c = catOf(t.category); if (c && c.kind !== 'expense') continue;
    (groups[merchantKey(t.desc)] ||= []).push(t);
  }
  const out = [];
  for (const [key, all] of Object.entries(groups)) {
    const list = all.slice().sort((a, b) => a.date.localeCompare(b.date));
    if (list.length < 3) continue;
    const gaps = list.slice(1).map((t, i) => daysBetween(list[i].date, t.date)), g = median(gaps);
    const freq = g >= 6 && g <= 8 ? 'weekly' : g >= 13 && g <= 16 ? 'biweekly' : g >= 26 && g <= 35 ? 'monthly' : g >= 350 && g <= 380 ? 'yearly' : null;
    if (!freq || gaps.filter(x => Math.abs(x - g) <= Math.max(3, g * 0.2)).length < gaps.length * 0.7) continue;
    const amts = list.map(t => -t.amount), m = median(amts);
    if (amts.filter(a => Math.abs(a - m) / m <= 0.25).length < amts.length * 0.7) continue;
    const last = list[list.length - 1], prev = list[list.length - 2], lastAmt = -last.amount, prevAmt = -prev.amount;

    const cats = {}; list.forEach(t => { if (t.category) cats[t.category] = (cats[t.category] || 0) + 1; });
    out.push({key, name:niceName(key), freq, gap:g, typical:round2(m), amount:lastAmt, monthly, yearly:monthly * 12, last:last.date, count:list.length,
      day:+last.date.slice(8), categoryId:(Object.entries(cats).sort((a, b) => b[1] - a[1])[0] || [''])[0],

/* ============================== Closing a month & the month archive ============================== */
/*
 * Months are closed in order. Closing month k:
 *  - freezes a snapshot of k (kept in S.months[k].snapshot, viewable on the Archive tab),
 *  - debts: k's ending balance becomes the next month's starting balance,
 *  - savings: k's ending balance carries over (a balance entry is added if you corrected it),
 *  - bills: k's amounts / due days are copied to the next month (still editable per month).
 * The most recent closed month can be reopened, which reverses all of the above.
 */
const prevMonth = k => monthKey(addDays(k + '-01', -1));
const isClosed = k => !!(S.months[k] && S.months[k].closed);
/** The month you're working on: the first month (from where you started) that isn't closed yet. */
function openMonth(){
  const P = getPeriods();
  let k = S.startMonth || (P[0] ? P[0].key : monthKey(today()));
  for (let i = 0; i < 600 && isClosed(k); i++) k = nextMonth(k);
  return k;
}
const lastClosedMonth = () => { const k = prevMonth(openMonth()); return isClosed(k) ? k : null; };

function debtBalanceAt(d, date){
  if (date < d.asOf) { const h = (d.history || []).find(x => monthEnd(x.month) >= date && monthStart(x.month) <= date); return h ? h.end : +d.originalBalance || +d.balance || 0; }
  return round2(Math.max(0, (+d.balance || 0) - debtPayments(d).filter(x => x.date <= date).reduce((s, x) => s + x.amount, 0)));
}
function debtStart(d, k){
  const h = (d.history || []).find(x => x.month === prevMonth(k));
  if (h) return h.end;
  return d.asOf < monthStart(k) ? debtBalanceAt(d, addDays(monthStart(k), -1)) : +d.originalBalance || +d.balance || 0;
}
function goalBalanceAt(g, date){
  const list = goalEntries(g).filter(e => e.date <= date), snap = list.filter(e => e.kind === 'set').sort((a, b) => b.date.localeCompare(a.date))[0];
  const base = snap ? +snap.amount : (+g.start || 0);
  return round2(base + list.filter(e => e.kind !== 'set' && (!snap || e.date > snap.date)).reduce((s, e) => s + e.amount, 0));
}
const goalStart = (g, k) => { const h = (g.history || []).find(x => x.month === prevMonth(k)); return h ? h.end : goalBalanceAt(g, addDays(monthStart(k), -1)); };

/** Month page: the bar that shows this month's status and the Next-month button. */
function monthStatusBar(p){
  const om = openMonth(), k = p.key;
  if (isClosed(k)) {
    const canReopen = lastClosedMonth() === k;
    return `<div class="note info" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span style="flex:1">🔒 <b>${monthName(k)} is closed</b> (on ${fmtDate(S.months[k].closedAt)}). Its summary is saved in the archive.</span>
      <button class="btn small" onclick="showArchived('${k}')">View archived summary</button>${canReopen ? `<button class="btn small" onclick="reopenMonth('${k}')">Reopen</button>` : ''}</div>`;
  }
  if (k === om) return `<div class="monthbar"><div class="grow"><b>You're working on ${monthName(k)}.</b> <span class="muted small">When it's done, close it — balances and bills carry into ${monthName(nextMonth(k))}.</span>
      ${closeChecklist(p)}</div>
      <button class="btn primary" onclick="closeMonthModal('${k}')">Next month: close ${monthName(k).split(' ')[0]} → ${monthName(nextMonth(k)).split(' ')[0]}</button></div>`;
  if (k > om) return `<div class="note info">Months are closed in order — <b>${monthName(om)}</b> is next. <a href="#" onclick="openPeriod('${monthStart(om)}');return false">Go to ${monthName(om)}</a>${!Object.keys(S.months).some(isClosed) ? ` · or <a href="#" onclick="setStartMonth('${k}');return false">start closing months from ${monthName(k)} instead</a>` : ''}</div>`;
  return `<div class="note info">${monthName(k)} is before you started closing months. <a href="#" onclick="setStartMonth('${k}');return false">Start from ${monthName(k)}</a></div>`;
}
/** What's left before a month is ready to close — shown as small check chips. */
function closeChecklist(p){
  const st = periodStats(p), k = p.key;
  const want = S.accounts.filter(a => !a.closed), have = want.filter(a => importsFor(a.id, k).length).length;
  const xf = findTransferPairs().filter(([o, i]) => (o.date >= p.start && o.date <= p.end) || (i.date >= p.start && i.date <= p.end)).length;
  const unpaid = billsInRange(p.start, p.end).filter(b => !b.paid).length;
  const items = [
    want.length ? [have === want.length, `Statements ${have}/${want.length}`, `go('import')`] : null,
    [!st.uncat, st.uncat ? `${st.uncat} to categorize` : 'All categorized', `quickSort('${p.start}')`],
    [!xf, xf ? `${xf} transfer${xf > 1 ? 's' : ''} to review` : 'Transfers checked', 'showTransfers()'],
    S.bills.length ? [!unpaid, unpaid ? `${unpaid} bill${unpaid > 1 ? 's' : ''} not seen paid` : 'Bills paid', `go('bills')`] : null,
    [today() > p.end, today() > p.end ? 'Month is over' : `${daysBetween(today(), p.end) + 1} days left`, ''],
  ].filter(Boolean);
  return `<div class="checks">${items.map(([ok, label, act]) => `<span class="chk ${ok ? 'ok' : ''}" ${act && !ok ? `onclick="${act}" style="cursor:pointer"` : ''}>${ok ? '✓' : '○'} ${label}</span>`).join('')}</div>`;

/** File an imported statement under a different account and/or month. */
function moveStatement(id){
