  const months = []; for (let k = nextMonth(monthKey(today())), n = 0; n < 36; n++) { months.push(k); k = prevMonth(k); }
  if (!months.includes(imp.month)) months.push(imp.month);
  openModal(`Move ${esc(imp.file)}`, `<div class="form">
    <label>Account<select id="mv_acct">${S.accounts.map(a => `<option value="${a.id}" ${a.id === imp.accountId ? 'selected' : ''}>${esc(acctLabel(a))}</option>`).join('')}</select></label>
    <label>Statement month<select id="mv_month">${months.sort().reverse().map(m => `<option value="${m}" ${m === imp.month ? 'selected' : ''}>${monthName(m)}</option>`).join('')}</select></label>
    ${isClosed(imp.month) ? `<div class="note" style="margin:0">${monthName(imp.month)} is closed — its archived summary won't change.</div>` : ''}
    <div class="muted small">Its ${imp.added} transactions move to the account you pick. Their dates don't change.</div></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMoveStatement('${id}')">Move</button>`);
}
async function saveMoveStatement(id){
  const imp = S.imports.find(i => i.id === id), a = acctById(document.getElementById('mv_acct').value), month = document.getElementById('mv_month').value;
  if (!imp || !a) return;
  const oldName = imp.account, oldMonth = imp.month;
  Object.assign(imp, {accountId:a.id, account:a.name, bank:a.bank || '', month});
  S.transactions.forEach(t => { if (t.importId === id) t.account = a.name; });
  closeModal(); save(); render(); doneUndo(`Moved to ${esc(a.name)} · ${monthName(month)}.`);
  // Move the archived original into the new month's folder
  if (imp.archive && month !== oldMonth && MODE === 'server') {
    try {
      const r = await fetch('api/statement?path=' + encodeURIComponent(imp.archive), {cache:'no-store'});
      if (r.ok) {
        const body = await r.text(), name = imp.archive.slice(8);
        const up = await fetch(`api/statement?month=${encodeURIComponent(month)}&name=${encodeURIComponent(name)}`, {method:'POST', headers:{'X-Budget':'1'}, body});
        if (up.ok) { const old = imp.archive; imp.archive = await up.text(); await deleteArchive(old); LAST = JSON.stringify(S); clearTimeout(saveTimer); saveTimer = setTimeout(doSave, 350); }
      }
    } catch(e) {}

}
function setStartMonth(k){
  if (Object.keys(S.months).some(isClosed)) { toast('You have already closed months — reopen them first to change where you started.'); return; }
  S.startMonth = k; save(); render(); toast(`Months will be closed starting with ${monthName(k)}.`);
}

function closeMonthModal(k){
  if (k !== openMonth()) { toast(`Close ${monthName(openMonth())} first.`); return; }
  const p = monthPeriod(k), st = periodStats(p), next = nextMonth(k), end = monthEnd(k);
  const notOver = today() <= end, missing = missingStatements(k);
  const monthlyBills = S.bills.filter(b => b.freq === 'monthly');
  const warn = [
    notOver ? `${monthName(k)} isn't over yet (${daysBetween(today(), end) + 1} days left). You can still close it now.` : '',
    st.uncat ? `${st.uncat} transaction${st.uncat > 1 ? 's' : ''} still need a category. <a href="#" onclick="closeModal();quickSort('${p.start}');return false">Sort them first</a>` : '',
    missing.length ? `No ${monthName(k)} statement imported yet for: ${missing.map(a => esc(a.name)).join(', ')}.` : '',
  ].filter(Boolean);
  openModal(`Close ${monthName(k)}`, `
    <div class="grid" style="margin-bottom:10px">

      <div class="stat"><div class="lbl">Spent</div><div class="val">${fmt(st.spent)}</div></div>
      <div class="stat"><div class="lbl">Left</div><div class="val ${st.income - st.spent < 0 ? 'neg' : ''}">${fmt(st.income - st.spent)}</div></div></div>
    ${warn.map(w => `<div class="note" style="margin-bottom:8px">${w}</div>`).join('')}
    ${S.debts.length ? `<h3 class="mt">Debts → carried into ${monthName(next)}</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Debt</th><th class="right">Started at</th><th class="right">Paid</th><th class="right">Ending balance</th></tr></thead><tbody>
      ${S.debts.map(d => `<tr><td>${esc(d.name)}</td><td class="num">${fmt(debtStart(d, k))}</td><td class="num">${fmt(debtPaidIn(d, p))}</td>
        <td class="num"><input type="number" step="0.01" class="cm-debt" data-id="${d.id}" value="${debtBalanceAt(d, end)}" style="width:120px;text-align:right">${!d.closedThrough && d.asOf >= monthStart(k) && d.asOf <= end ? `<div class="sub">you updated the balance on ${fmtDate(d.asOf, false)}</div>` : ''}</td></tr>`).join('')}</tbody></table></div>
      <div class="muted small">Change an ending balance to match your statement (for example, if interest was added).</div>` : ''}
    ${S.goals.length ? `<h3 class="mt">Savings → carried into ${monthName(next)}</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Account</th><th class="right">Started at</th><th class="right">Added</th><th class="right">Ending balance</th></tr></thead><tbody>
      ${S.goals.map(g => `<tr><td>${esc(g.name)}<div class="sub">${saveType(g).label}</div></td><td class="num">${fmt(goalStart(g, k))}</td><td class="num">${fmt(goalSavedIn(g, p))}</td>
        <td class="num"><input type="number" step="0.01" class="cm-goal" data-id="${g.id}" value="${goalBalanceAt(g, end)}" style="width:120px;text-align:right"></td></tr>`).join('')}</tbody></table></div>` : ''}
    ${monthlyBills.length ? `<h3 class="mt">Bills for ${monthName(next)}</h3><div class="tablewrap"><table class="tbl"><thead><tr><th>Bill</th><th class="right">Amount</th><th class="right">Due day</th><th style="text-align:center">Skip</th></tr></thead><tbody>
      ${monthlyBills.map(b => { const f = billFor(b, k); return `<tr><td>${esc(b.name)}</td>
        <td class="num"><input type="number" step="0.01" class="cm-bill" data-id="${b.id}" value="${f.amount}" style="width:110px;text-align:right"></td>
        <td class="num"><input type="number" min="1" max="31" class="cm-bday" data-id="${b.id}" value="${f.day}" style="width:64px;text-align:right"></td>
        <td style="text-align:center"><input type="checkbox" class="cm-bskip" data-id="${b.id}"></td></tr>`; }).join('')}</tbody></table></div>
      <div class="muted small">Same as ${monthName(k)} unless you change them here. You can still change any bill for ${monthName(next)} later.</div>` : ''}
    <label class="mt" style="display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)">Notes about ${monthName(k)} (optional, saved in the archive)<textarea id="cm-note" rows="2" style="color:var(--text)"></textarea></label>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doCloseMonth('${k}')">Close ${monthName(k).split(' ')[0]} & start ${monthName(next).split(' ')[0]}</button>`, true);
}

function doCloseMonth(k){
  if (k !== openMonth()) return;
  const p = monthPeriod(k), next = nextMonth(k), end = monthEnd(k), st = periodStats(p);
  const val = (cls, id) => { const el = document.querySelector(`.${cls}[data-id="${id}"]`); return el ? el : null; };
  const rec = {closed:true, closedAt:today(), note:(document.getElementById('cm-note') || {}).value || '', prev:{debts:{}, goalEntries:[], nextOverrides: S.billOverrides[next] ? JSON.parse(JSON.stringify(S.billOverrides[next])) : null, startMonth:S.startMonth}};
  // Debts: ending balance → next month's starting balance
  const debtsSnap = S.debts.map(d => {
    const start = debtStart(d, k), paid = debtPaidIn(d, p), el = val('cm-debt', d.id), endBal = round2(el ? +el.value || 0 : debtBalanceAt(d, end));
    rec.prev.debts[d.id] = {balance:d.balance, asOf:d.asOf, closedThrough:d.closedThrough || ''};
    (d.history ||= []).push({month:k, start, paid, end:endBal});
    Object.assign(d, {balance:endBal, asOf:end, closedThrough:end});
    return {name:d.name, start, paid, end:endBal};
  });
  // Savings: ending balance carries over (record a balance entry if it was corrected)
  const savSnap = S.goals.map(g => {
    const start = goalStart(g, k), added = goalSavedIn(g, p), calc = goalBalanceAt(g, end), el = val('cm-goal', g.id), endBal = round2(el ? +el.value || 0 : calc);
    if (Math.abs(endBal - calc) > 0.004) { const id = uid(); (g.entries ||= []).push({id, kind:'set', date:end, amount:endBal, note:`Balance at end of ${monthName(k)}`}); rec.prev.goalEntries.push([g.id, id]); }
    (g.history ||= []).push({month:k, start, added, end:endBal});
    return {name:g.name, type:saveType(g).label, start, added, end:endBal};
  });
  // Bills: copy this month's amounts / due days into next month
  const ov = (S.billOverrides[next] ||= {});
  for (const b of S.bills.filter(b => b.freq === 'monthly')) {
    const f = billFor(b, k), a = val('cm-bill', b.id), dday = val('cm-bday', b.id), sk = val('cm-bskip', b.id);
    const newAmt = a ? round2(+a.value || 0) : f.amount, newDay = dday ? Math.min(31, Math.max(1, +dday.value || f.day)) : f.day;
    // unchanged values are just carried forward, so the bill keeps adjusting to what you really pay
    ov[b.id] = {amount:newAmt, day:newDay, skip: sk ? sk.checked : false, carried: Math.abs(newAmt - f.amount) < 0.005 && newDay === f.day};
  }
  const merch = {}; for (const t of st.tx) { const a = spendOf(t); if (a > 0) { const m = merchantKey(t.desc); merch[m] = (merch[m] || 0) + a; } }
  rec.snapshot = {
    income:st.income, spent:st.spent, txCount:st.tx.length, uncat:st.uncat, byCat:st.byCat, budget:{...S.budget},
    cats:S.categories.map(c => ({id:c.id, name:c.name, color:c.color, kind:c.kind})),
    pays:st.pays.map(x => ({date:x.date, amount:x.amount, source:x.source})),
    bills:billsInRange(p.start, p.end).map(x => ({name:x.bill.name, due:x.due, amount:x.amount, paid:!!x.paid, paidOn:x.paid ? x.paid.date : ''})),
    debts:debtsSnap, savings:savSnap,
    statements:S.imports.filter(i => i.month === k).map(i => ({id:i.id, account:i.account, bank:i.bank, file:i.file, added:i.added})),
    top:Object.entries(merch).sort((a, b) => b[1] - a[1]).slice(0, 8),
  };
  S.months[k] = rec;
  if (!S.startMonth) S.startMonth = k;
  closeModal(); save();
  PI = getPeriods().findIndex(x => x.key === next); if (PI < 0) PI = null;
  render(); doneUndo(`${monthName(k)} closed and archived. Welcome to ${monthName(next)}!`);
}

function reopenMonth(k){
  if (lastClosedMonth() !== k) { toast('Only the most recently closed month can be reopened.'); return; }
  if (!confirm(`Reopen ${monthName(k)}? Debt and savings balances and next month's bills go back to how they were before you closed it.`)) return;
  const rec = S.months[k], next = nextMonth(k);
  for (const d of S.debts) {
    const pv = rec.prev.debts[d.id];
    if (pv) Object.assign(d, {balance:pv.balance, asOf:pv.asOf, closedThrough:pv.closedThrough});
    d.history = (d.history || []).filter(h => h.month !== k);
  }
  for (const [gid, eid] of rec.prev.goalEntries) { const g = S.goals.find(x => x.id === gid); if (g) g.entries = g.entries.filter(e => e.id !== eid); }
  for (const g of S.goals) g.history = (g.history || []).filter(h => h.month !== k);
  if (rec.prev.nextOverrides) S.billOverrides[next] = rec.prev.nextOverrides; else delete S.billOverrides[next];
  S.startMonth = rec.prev.startMonth;
  delete S.months[k];
  PI = getPeriods().findIndex(x => x.key === k); if (PI < 0) PI = null;
  save(); render(); doneUndo(`${monthName(k)} reopened.`);
}

      <div class="row"><label class="field">Start closing months from<select onchange="setStartMonth(this.value)">${getPeriods().map(p => `<option value="${p.key}" ${p.key === om ? 'selected' : ''}>${p.label}</option>`).join('')}</select></label></div></div>` : ''}

const acctByName = n => S.accounts.find(a => a.name.toLowerCase() === String(n || '').toLowerCase());

function guessAcctType(name){ return /card|visa|master|amex|discover|credit/i.test(name) ? 'credit' : /sav/i.test(name) ? 'savings' : 'checking'; }
/** The month a statement covers: the month holding most of its transactions (later month wins a tie). */
function statementMonth(items){
  const c = {}; for (const x of items) c[monthKey(x.date)] = (c[monthKey(x.date)] || 0) + 1;
  return Object.entries(c).sort((a, b) => b[1] - a[1] || b[0].localeCompare(a[0]))[0]?.[0] || monthKey(today());
}
const importsFor = (acctId, k) => S.imports.filter(i => i.accountId === acctId && i.month === k);

function missingStatements(k){

/* ---------- archive files on the drive (encrypted when a password is set) ---------- */
async function archiveStatement(month, fileName, text){
  if (MODE !== 'server') return '';
  let body = text, name = fileName;
  if (KEY) { body = await encryptText(text); name += '.locked'; }
  try {
    const r = await fetch(`api/statement?month=${encodeURIComponent(month)}&name=${encodeURIComponent(name)}`, {method:'POST', headers:{'X-Budget':'1'}, body});
    return r.ok ? await r.text() : '';
  } catch(e) { return ''; }
}
async function readArchive(path, password){
  const r = await fetch('api/statement?path=' + encodeURIComponent(path), {cache:'no-store'});
  if (!r.ok) throw new Error('missing');
  const t = await r.text();
  if (!path.endsWith('.locked')) return t;
  return (await decryptWith(JSON.parse(t), password || PW)).text;
}
async function downloadStatement(id, password){
  const imp = S.imports.find(i => i.id === id); if (!imp || !imp.archive) return;
  try {
    const text = await readArchive(imp.archive, password);
    if (/\.b64(\.locked)?$/.test(imp.archive)) download(imp.file, bytesFromB64(text), /\.pdf$/i.test(imp.file) ? 'application/pdf' : 'application/octet-stream');
    else download(imp.file, text, 'text/plain');
    closeModal();
  } catch(e) {
    if (String(e.message) === 'missing') { toast('That file is no longer in the archive folder.'); return; }
    openModal('Older password needed', `<form class="form" onsubmit="downloadStatement('${id}',document.getElementById('apw').value);return false">
      <p class="muted" style="margin:0">This statement was archived with a different password. Enter that password to open it.</p>
      <input type="password" id="apw"><button hidden></button></form>`,
      `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="downloadStatement('${id}',document.getElementById('apw').value)">Open</button>`);
  }
}
async function deleteArchive(path){ if (MODE === 'server' && path) try { await fetch('api/statement-delete?path=' + encodeURIComponent(path), {method:'POST', headers:{'X-Budget':'1'}}); } catch(e) {} }
/** After a password is set/changed/removed: re-save archived statements so they match. */
async function rewriteArchives(decryptAll, oldPw){
  if (MODE !== 'server') return;
  let n = 0, failed = 0;
  for (const imp of S.imports.filter(i => i.archive)) {
    const locked = imp.archive.endsWith('.locked');
    if (!decryptAll && locked && imp.archiveSalt === (SALT && b64(SALT))) continue;
    try {
      const text = await readArchive(imp.archive, oldPw || PW);
      const old = imp.archive;
      const keep = KEY; if (decryptAll) KEY = null;
      imp.archive = await archiveStatement(imp.month, imp.file, text);
      KEY = keep;
      imp.archiveSalt = decryptAll ? '' : (SALT ? b64(SALT) : '');
      if (imp.archive) { await deleteArchive(old); n++; } else imp.archive = old;
    } catch(e) { failed++; }
  }
  if (n || failed) { await doSave(); toast(`${n} archived statement${n === 1 ? '' : 's'} ${decryptAll ? 'unlocked' : 're-encrypted'}${failed ? ` · ${failed} could not be opened` : ''}.`); }
}

function addMonths(s, n){ const d = new Date(s + 'T00:00:00Z'); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); d.setUTCDate(Math.min(day, last)); return d.toISOString().slice(0, 10); }
const monthLabel = s => new Date(s + 'T00:00:00Z').toLocaleDateString(undefined, {month:'short', year:'numeric', timeZone:'UTC'});
const termsOf = m => String(m || '').toLowerCase().split('|').map(x => x.trim()).filter(Boolean);
const matchesTerms = (terms, t) => { const d = t.desc.toLowerCase(); return terms.some(k => d.includes(k)); };
/* ---------- savings accounts (emergency fund, vacation fund, 401(k), IRA, HSA…) ---------- */
const SAVE_TYPES = {
  emergency:{label:'Emergency fund'}, sinking:{label:'Vacation / sinking fund'}, savings:{label:'General savings'},
  k401:{label:'401(k) / 403(b)', retire:true, payroll:true}, ira:{label:'Traditional IRA', retire:true}, roth:{label:'Roth IRA', retire:true},
  hsa:{label:'HSA', retire:true, payroll:true}, kids:{label:'Kids account (Trump / 529 / UTMA)', retire:true}, brokerage:{label:'Brokerage / investing', retire:true}, other:{label:'Other'},
};
const saveType = g => SAVE_TYPES[g.type] || SAVE_TYPES.savings;
const SAVE_ICONS = {emergency:'🛟', sinking:'✈️', savings:'🐷', k401:'📈', ira:'📈', roth:'📈', hsa:'🩺', kids:'🧸', brokerage:'📊', other:'💰'};
const goalBadge = g => `<span class="cicon big" style="--c:${g.color}" aria-hidden="true">${SAVE_ICONS[g.type] || '🐷'}</span>`;
/** When a debt is paid off at its minimum payment (with its APR): {months, date} — or null if the minimum never pays it off. */
function debtPayoffAtMin(d){
  let b = debtBalance(d), m = 0; const r = (+d.apr || 0) / 1200, pay = +d.minPayment || 0;
  if (b <= 0.005) return {months:0, date:today()};
  if (!pay || pay <= b * r) return null;
  while (b > 0.005 && m < 600) { b = b * (1 + r) - pay; m++; }
  return m >= 600 ? null : {months:m, date:addMonths(monthStart(openMonth()), m)};
}
const isInvest = g => !!saveType(g).retire;
/** Everything that moved the balance: manual deposits/withdrawals, balance updates (kind:'set'), and matching transfers. */
function goalEntries(g){
  const out = (g.entries || []).map(e => ({...e, manual:true}));
  const terms = termsOf(g.matchText);
  if (terms.length) for (const t of S.transactions) if (t.date >= (g.startDate || '0000') && matchesTerms(terms, t)) out.push({id:t.id, date:t.date, amount:-t.amount, note:t.desc, manual:false});
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
/** Balance = the latest "update balance" snapshot (or the starting amount) plus anything after it. */
function goalBalance(g){
  const list = goalEntries(g), snap = list.filter(e => e.kind === 'set').sort((a, b) => b.date.localeCompare(a.date))[0];
  const base = snap ? +snap.amount : (+g.start || 0);
  return round2(base + list.filter(e => e.kind !== 'set' && (!snap || e.date > snap.date)).reduce((s, e) => s + e.amount, 0));
}
const goalSavedIn = (g, p) => goalEntries(g).filter(e => e.kind !== 'set' && e.date >= p.start && e.date <= p.end).reduce((s, e) => s + e.amount, 0);
const monthsUntil = d => { const a = today(), y = +d.slice(0, 4) - +a.slice(0, 4), m = +d.slice(5, 7) - +a.slice(5, 7); return y * 12 + m; };
function goalForecast(g){
  const bal = goalBalance(g), target = +g.target || 0, left = Math.max(0, target - bal);
  const monthly = (+g.perCycle || 0) + (+g.match || 0);
  const r = {bal, target, left, monthly, pct: target ? Math.min(100, bal / target * 100) : 0, done: target > 0 && bal >= target};
  if (target && !r.done && monthly > 0) { r.months = Math.ceil(left / monthly); r.eta = addMonths(today(), r.months); }
  if (target && !r.done && g.targetDate && g.targetDate >= today()) {
    r.monthsToDate = Math.max(1, monthsUntil(g.targetDate));
    r.needed = round2(Math.max(0, left / r.monthsToDate - (+g.match || 0)));
  }
  return r;
}

/* ---------- debts ---------- */
/** Payments since the balance was last set: manual ones + matching transactions (either side of a card payment). */
function debtPayments(d, all){
  // After a month is closed, asOf = that month's last day and its payments are already in the balance.
  // all: every payment, even ones before the balance was last set (for "what was paid in a month").
  const out = (d.payments || []).filter(x => all || (d.closedThrough ? x.date > d.asOf : x.date >= d.asOf)).map(x => ({...x, manual:true}));
  const terms = termsOf(d.match);
  if (terms.length) for (const t of S.transactions) if ((all || t.date > d.asOf) && matchesTerms(terms, t)) out.push({id:t.id, date:t.date, amount:Math.abs(t.amount), note:t.desc + (t.account ? ' · ' + t.account : ''), manual:false});
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
const debtBalance = d => round2(Math.max(0, (+d.balance || 0) - debtPayments(d).reduce((s, x) => s + x.amount, 0)));
// Correcting a balance mid-month doesn't undo that month's payments, so this ignores asOf.
const debtPaidIn = (d, p) => debtPayments(d, true).filter(x => x.date >= p.start && x.date <= p.end).reduce((s, x) => s + x.amount, 0);
/**
 * Month-by-month payoff simulation. Interest accrues monthly at APR/12, minimums are paid,
 * then `extra` (plus minimums freed by paid-off debts, if rollover) goes to the target debt.
 */
function payoffPlan(extra, method, rollover = true){
  const ds = S.debts.map(d => ({id:d.id, name:d.name, bal:debtBalance(d), apr:+d.apr || 0, min:+d.minPayment || 0})).filter(d => d.bal > 0.005);
  if (!ds.length) return null;
  let month = 0, interest = 0;
  const trail = [ds.reduce((s, d) => s + d.bal, 0)], done = {};
  while (ds.some(d => d.bal > 0.005) && month < 600) {
    month++;
    let pool = extra;
    for (const d of ds) if (d.bal > 0.005) { const i = d.bal * d.apr / 1200; d.bal += i; interest += i; }
    for (const d of ds) {
      if (d.bal > 0.005) { const pay = Math.min(d.min, d.bal); d.bal -= pay; if (rollover) pool += d.min - pay; }
      else if (rollover) pool += d.min;
    }
    const order = ds.filter(d => d.bal > 0.005).sort(method === 'snowball' ? (a, b) => a.bal - b.bal : (a, b) => (b.apr - a.apr) || (a.bal - b.bal));
    for (const d of order) { if (pool <= 0) break; const pay = Math.min(pool, d.bal); d.bal -= pay; pool -= pay; }
    for (const d of ds) if (d.bal <= 0.005 && !done[d.id]) done[d.id] = month;
    trail.push(ds.reduce((s, d) => s + Math.max(0, d.bal), 0));
    if (month === 24 && trail[24] >= trail[0] - 0.01) return {stuck:true};
  }
  return month >= 600 ? {stuck:true} : {months:month, interest, done, trail, end:addMonths(today(), month)};
}

    targetDate:v('g_date'), matchText:v('g_matchtext').trim().toLowerCase(), color:v('g_color')};
  if (pctMode) {
    const gross = round2(+v('g_gross') || 0);
    if (gross !== +(S.settings.pay || {}).gross) S.settings.pay = {...(S.settings.pay || {freq:'biweekly', anchor:'', amount:0, source:''}), gross};
    data.pct = Math.max(0, +v('g_pct') || 0);
    data.matchPct = retire && v('g_matchpct') !== '' ? Math.max(0, +v('g_matchpct') || 0) : null;
  } else data.pct = data.matchPct = null;
  const bal = round2(+v('g_bal') || 0);
  if (id) {
    const g = S.goals.find(x => x.id === id);
    Object.assign(g, data);
    if (Math.abs(bal - goalBalance(g)) > 0.004) (g.entries ||= []).push({id:uid(), kind:'set', date:today(), amount:bal, note:'Balance updated'});
  } else S.goals.push({id:uid(), startDate:today(), entries:[], start:bal, ...data});
  for (const g of S.goals) for (const k of ['pct', 'matchPct']) if (g[k] == null) delete g[k];
  syncPctGoals();
  closeModal(); save(); render();
}

function saveDebt(id){
  const v = x => document.getElementById(x).value;
  const name = v('d_name').trim(), bal = round2(+v('d_bal') || 0);
  if (!name || v('d_bal') === '') { toast('Enter a name and the current balance.'); return; }
  const data = {name, kind:v('d_kind'), apr:+v('d_apr') || 0, minPayment:round2(+v('d_min') || 0), dueDay:Math.min(31, Math.max(0, +v('d_due') || 0)), match:v('d_match').trim().toLowerCase()};
  let d;
  if (id) {
    d = S.debts.find(x => x.id === id);
    if (Math.abs(bal - debtBalance(d)) > 0.004) Object.assign(d, {balance:bal, asOf:today(), closedThrough:''});
    Object.assign(d, data);
    const pm = document.getElementById('d_paidmo'), k = openMonth();
    if (pm) { d.paidMonths = (d.paidMonths || []).filter(x => x !== k); if (pm.checked) d.paidMonths.push(k); if (!d.paidMonths.length) delete d.paidMonths; }
  } else { d = {id:uid(), balance:bal, originalBalance:bal, asOf:today(), payments:[], ...data}; S.debts.push(d); }
  const want = document.getElementById('d_bill') && document.getElementById('d_bill').checked;
  let bill = S.bills.find(b => b.id === d.billId);
  if (!bill && want && d.minPayment) { bill = {id:uid()}; S.bills.push(bill); d.billId = bill.id; }
  if (bill) Object.assign(bill, {name:d.name + ' payment', amount:d.minPayment, freq:'monthly', day:d.dueDay || 1, anchor:today(), match:d.match, categoryId:bill.categoryId || 'c_debt'});
  closeModal(); save(); render();
}

function renderReports(){
  const P = getPeriods();
  if (!P.length) { V.innerHTML = `<h1>Reports</h1><div class="card muted">Import some transactions to see reports.</div>`; return; }
  if (PI == null || PI >= P.length) PI = currentIdx(P);
  const p = P[PI], prevP = P[PI - 1], word = 'month';
  const hist = P.slice(Math.max(0, PI - 6), PI);              // up to 6 periods before this one
  const st = periodStats(p), stPrev = prevP ? periodStats(prevP) : null, stH = hist.map(periodStats);
  const avgOf = id => stH.length ? stH.reduce((s, x) => s + (x.byCat[id] || 0), 0) / stH.length : null;
  const ids = new Set([...Object.keys(st.byCat), ...(stPrev ? Object.keys(stPrev.byCat) : [])]);
  const rows = [...ids].map(id => ({id, name: id ? catName(id) : 'Uncategorized', now: st.byCat[id] || 0, prev: stPrev ? stPrev.byCat[id] || 0 : null, avg: avgOf(id), b: +S.budget[id] || 0}))
    .filter(r => r.now || r.prev || r.avg).sort((a, b) => b.now - a.now);
  const delta = (now, avg, good) => {
    if (avg == null) return '';
    const d = now - avg; if (Math.abs(d) < 1) return '<span class="muted">same</span>';
    const pct = avg ? ` (${d > 0 ? '+' : ''}${Math.round(d / avg * 100)}%)` : '';
    return `<span class="${(d > 0) !== !!good ? 'neg' : 'pos'}">${d > 0 ? '▲ ' : '▼ '}${fmt(Math.abs(d))}${pct}</span>`; // paying more toward debt/savings is good
  };
  const savedIn = x => S.goals.reduce((s, g) => s + goalSavedIn(g, x), 0), debtIn = x => S.debts.reduce((s, d) => s + debtPaidIn(d, x), 0);
  const flowP = P.slice(Math.max(0, PI - 11), PI + 1).reverse();
  const y = today().slice(0, 4), ytd = {start:y + '-01-01', end:today(), mode:p.mode}, stY = periodStats(ytd);
  const topY = Object.entries(stY.byCat).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const savedY = savedIn(ytd);

  V.innerHTML = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="flex:1">Reports</h1>
      <button class="btn noprint" onclick="window.print()">Print / Save as PDF</button></div>
    <div class="period noprint">
      <button class="btn" onclick="PI=Math.max(0,PI-1);render()" ${PI === 0 ? 'disabled' : ''} title="Previous">◀</button>
      <select onchange="PI=+this.value;render()">${P.map((x, i) => `<option value="${i}" ${i === PI ? 'selected' : ''}>${x.label}${x.open ? ' · current' : ''}</option>`).join('')}</select>
      <button class="btn" onclick="PI=Math.min(${P.length - 1},PI+1);render()" ${PI === P.length - 1 ? 'disabled' : ''} title="Next">▶</button>
    </div>
    <div class="printonly"><b>${p.label}</b> · printed ${fmtDate(today())}</div>
    <div class="grid">
      <div class="stat"><div class="lbl">Income</div><div class="val pos">${fmt(st.income)}</div><div class="sub">${stPrev ? 'last ' + word + ': ' + fmt(stPrev.income) : ''}</div></div>
      <div class="stat"><div class="lbl">Spent</div><div class="val">${fmt(st.spent)}</div><div class="sub">${stPrev ? 'last ' + word + ': ' + fmt(stPrev.spent) : ''}</div></div>
      <div class="stat"><div class="lbl">Saved toward goals</div><div class="val">${fmt(savedIn(p))}</div><div class="sub">${st.income ? Math.round(savedIn(p) / st.income * 100) + '% of income' : ''}</div></div>
      <div class="stat"><div class="lbl">Paid toward debt</div><div class="val">${fmt(debtIn(p))}</div></div>
    </div>
    <div class="card" style="padding:8px"><h3 style="padding:6px 8px 0">Spending by category — ${p.label}</h3><div class="tablewrap"><table class="tbl">
      <thead><tr><th>Category</th><th class="right">This ${word}</th><th class="right">Budget</th><th class="right">Last ${word}</th><th class="right">Average${stH.length ? ' (prior ' + stH.length + ')' : ''}</th><th class="right">vs. average</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${catDot(r.id)}${esc(r.name)}</td><td class="num"><b>${fmt(r.now)}</b></td><td class="num muted">${r.b ? fmt(r.b) : '—'}</td>
        <td class="num">${r.prev == null ? '—' : fmt(r.prev)}</td><td class="num">${r.avg == null ? '—' : fmt(r.avg)}</td><td class="num">${delta(r.now, r.avg, goodWhenOver(r.id))}</td></tr>`).join('') || '<tr><td colspan="6" class="empty">No spending.</td></tr>'}</tbody>
      <tfoot><tr><td>Total</td><td class="num">${fmt(st.spent)}</td><td class="num">${fmt(totalBudget())}</td><td class="num">${stPrev ? fmt(stPrev.spent) : '—'}</td><td class="num">${stH.length ? fmt(stH.reduce((s, x) => s + x.spent, 0) / stH.length) : '—'}</td><td></td></tr></tfoot></table></div>
      <div class="muted small" style="padding:4px 8px 8px">▲ = spent more than usual, ▼ = less. ${p.open ? `This ${word} isn't over yet, so totals will grow.` : ''}</div></div>
    <div class="two">
      <div class="card" style="padding:8px"><h3 style="padding:6px 8px 0">Cash flow by ${word}</h3><div class="tablewrap"><table class="tbl">
        <thead><tr><th>${word[0].toUpperCase() + word.slice(1)}</th><th class="right">Income</th><th class="right">Spent</th><th class="right">Saved</th><th class="right">Left</th></tr></thead>
        <tbody>${flowP.map(x => { const s2 = periodStats(x), l = s2.income - s2.spent; return `<tr style="cursor:pointer" onclick="PI=${P.indexOf(x)};render()"><td style="white-space:nowrap">${x.label}</td><td class="num">${fmt(s2.income)}</td><td class="num">${fmt(s2.spent)}</td><td class="num">${fmt(savedIn(x))}</td><td class="num ${l < 0 ? 'neg' : ''}">${fmt(l)}</td></tr>`; }).join('')}</tbody></table></div></div>
      <div class="card"><h3>${y} so far</h3>
        <div class="plan-row"><span class="grow">Income</span><b class="num">${fmt(stY.income || S.paychecks.filter(x => x.date >= ytd.start).reduce((s, x) => s + +x.amount, 0))}</b></div>
        <div class="plan-row"><span class="grow">Spent</span><b class="num">${fmt(stY.spent)}</b></div>
        <div class="plan-row"><span class="grow">Saved toward goals</span><b class="num">${fmt(savedY)}</b></div>
        <div class="plan-row"><span class="grow">Paid toward debt</span><b class="num">${fmt(debtIn(ytd))}</b></div>
        <h3 class="mt">Top categories this year</h3>
        ${topY.map(([id, v]) => `<div class="plan-row">${catDot(id)}<span class="grow">${esc(id ? catName(id) : 'Uncategorized')}</span><span class="num">${fmt(v)}</span></div>`).join('') || '<div class="muted small">Nothing yet.</div>'}</div>
    </div>`;
}

function drawQuick(){

/* ============================== Full backup (.zip): data + archived statements ============================== */
/* A USB drive can fail or get lost — this makes one file to keep somewhere else (computer, cloud drive, email to yourself). */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(bytes){ let c = 0xFFFFFFFF; for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
/** Minimal ZIP writer ("stored", no compression) — every unzip tool and Windows Explorer can open it. */
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const d = new Date(), dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const f of files) {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
    h.setUint16(10, dosTime, true); h.setUint16(12, dosDate, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, data);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, dosTime, true); c.setUint16(14, dosDate, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, name.length, true); c.setUint32(42, offset, true);
    central.push(new Uint8Array(c.buffer), name);
    offset += 30 + name.length + data.length;
  }
  const cdSize = central.reduce((s, x) => s + x.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
/** Reads the stored (uncompressed) ZIPs this app writes. */
function readZip(buf){
  const v = new DataView(buf), dec = new TextDecoder(), out = [];
  let p = 0;
  while (p + 30 <= buf.byteLength && v.getUint32(p, true) === 0x04034b50) {
    const method = v.getUint16(p + 8, true), size = v.getUint32(p + 18, true), nlen = v.getUint16(p + 26, true), xlen = v.getUint16(p + 28, true);
    const name = dec.decode(new Uint8Array(buf, p + 30, nlen)), start = p + 30 + nlen + xlen;
    if (method !== 0) throw new Error('compressed');
    out.push({name, text: dec.decode(new Uint8Array(buf, start, size))});
    p = start + size;
  }
  return out;
}
async function fullBackup(){

  let missing = 0;

    try { const r = await fetch('api/statement?path=' + encodeURIComponent(i.archive), {cache:'no-store'}); if (!r.ok) throw 0; files.push({name:'statements/' + i.archive, data: await r.text()}); }
    catch(e) { missing++; }
  }
  files.push({name:'HOW-TO-RESTORE.txt', data:`Budget Buddy full backup made ${today()}.\r\n\r\nTo restore: open Budget Buddy > Backup & Settings > "Restore from backup…" and choose this .zip file.\r\n${KEY ? 'This backup is password-protected: you will need the password you had when it was made.\r\n' : ''}\r\nbudget-data.json = all your budget data. statements/ = your original statement files, by month.\r\n`});
  const blob = makeZip(files), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `BudgetBuddy-backup-${today()}.zip`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  S.settings.lastFullBackup = today(); save(); render();
  toast(`Backup saved to your Downloads folder (${files.length - 1} file${files.length === 2 ? '' : 's'}${missing ? `, ${missing} statement file${missing > 1 ? 's' : ''} not found` : ''}). Move it off the USB drive — e.g. to your computer or a cloud folder.`);
}
/** Restore from a full-backup ZIP: data plus statement files (re-archived on this drive). */
async function restoreZip(file){
  let entries;
  try { entries = readZip(await file.arrayBuffer()); } catch(e) { toast("That .zip isn't a Budget Buddy backup."); return; }
  const dataEntry = entries.find(e => e.name === 'budget-data.json');
  if (!dataEntry) { toast("That .zip isn't a Budget Buddy backup."); return; }
  window._zipStatements = entries.filter(e => e.name.startsWith('statements/'));
  await restoreJSON(new File([dataEntry.text], 'budget-data.json'));
}
/** After a backup is restored: put its statement files back into data\statements and fix the links. */
async function restoreZipStatements(){
  const list = window._zipStatements || []; window._zipStatements = null;
  if (!list.length || MODE !== 'server') return;
  let n = 0;
  for (const e of list) {
    const rel = e.name.slice('statements/'.length), month = rel.slice(0, 7), name = rel.slice(8);
    try {
      const ex = await fetch('api/statement?path=' + encodeURIComponent(rel), {cache:'no-store'});
      if (ex.ok) { n++; continue; } // already on this drive
      const r = await fetch(`api/statement?month=${encodeURIComponent(month)}&name=${encodeURIComponent(name)}`, {method:'POST', headers:{'X-Budget':'1'}, body:e.text});
      if (!r.ok) continue;
      const newPath = await r.text();
      for (const i of S.imports) if (i.archive === rel) i.archive = newPath;
      n++;
    } catch(err) {}
  }
  save(); toast(`Backup restored, including ${n} statement file${n === 1 ? '' : 's'}.`);
}

/* ============================== Pay schedule (biweekly etc.) ============================== */
const PAY_FREQ = {biweekly:'Every 2 weeks', weekly:'Every week', semimonthly:'Twice a month (1st & 15th)', monthly:'Once a month'};
const PAYS_PER_YEAR = {biweekly:26, weekly:52, semimonthly:24, monthly:12};
/** Average gross (before-tax) pay per month, from S.settings.pay.gross = gross pay per check. */
const grossMonthly = () => { const ps = S.settings.pay || {}; return (+ps.gross || 0) * (PAYS_PER_YEAR[ps.freq] || 26) / 12; };
/** Savings set as a % of pay (g.pct, employer g.matchPct): keep perCycle / match in dollars so every other view just works. */
function syncPctGoals(){
  let changed = false;
  for (const g of S.goals) for (const [pk, ak] of [['pct', 'perCycle'], ['matchPct', 'match']]) {
    if (g[pk] == null) continue;
    const v = round2(grossMonthly() * g[pk] / 100);
    if (v !== +g[ak]) { g[ak] = v; changed = true; }
  }
  return changed;
}
/** Paydays between start and end from the schedule in S.settings.pay = {freq, anchor (a real payday), amount (0 = average)}. */
function payDates(start, end){
  const ps = S.settings.pay; if (!ps || !ps.anchor) return [];
  const out = [];
  if (ps.freq === 'weekly' || ps.freq === 'biweekly') {
    const step = ps.freq === 'weekly' ? 7 : 14;
    let d = addDays(ps.anchor, Math.ceil(daysBetween(ps.anchor, start) / step) * step);
    for (; d <= end; d = addDays(d, step)) out.push(d);
  } else {
    for (let k = monthKey(start); k <= monthKey(end); k = nextMonth(k)) {
      const days = ps.freq === 'semimonthly' ? [1, 15] : [+ps.anchor.slice(8)];
      for (const day of days) { const d = `${k}-${pad(Math.min(day, +monthEnd(k).slice(8)))}`; if (d >= start && d <= end) out.push(d); }
    }
  }
  return out;
}
/** Typical take-home: the amount set in the schedule, else the average of the last 3 paychecks. */
function typicalPay(){
  const ps = S.settings.pay || {};
  if (+ps.amount > 0) return +ps.amount;
  const last = S.paychecks.slice().sort((a, b) => a.date.localeCompare(b.date)).slice(-3);
  return last.length ? round2(last.reduce((s, p) => s + +p.amount, 0) / last.length) : 0;
}
/** Expected paydays in a month, each matched to a recorded paycheck (within 4 days) if there is one. */
function monthPaydays(k){
  const used = new Set();
  return payDates(monthStart(k), monthEnd(k)).map(date => {
    const rec = S.paychecks.filter(p => !used.has(p.id) && Math.abs(daysBetween(p.date, date)) <= 4).sort((a, b) => Math.abs(daysBetween(a.date, date)) - Math.abs(daysBetween(b.date, date)))[0];
    if (rec) used.add(rec.id);
    return {date, rec, amount: rec ? +rec.amount : typicalPay()};
  });
}
/** Planned income for a month: received paychecks + expected ones not received yet (+ other income received). */
function plannedIncome(p){
  const st = periodStats(p), days = monthPaydays(p.key);
  if (!days.length) return st.income;
  const pending = days.filter(d => !d.rec && d.date >= today()).reduce((s, d) => s + d.amount, 0);
  return round2(st.income + pending);
}
function recordPaycheck(date){
  const amt = typicalPay(), src = (S.settings.pay || {}).source || 'Paycheck';
  openModal(`Paycheck — ${fmtDate(date)}`, `<div class="form"><div class="row">
      <label style="flex:1">Date received<input type="date" id="rp_date" value="${date}"></label>
      <label style="flex:1">Take-home amount<input type="number" step="0.01" id="rp_amt" value="${amt || ''}" placeholder="0.00"></label></div>
      <label>From<input id="rp_src" value="${esc(src)}"></label></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRecordPaycheck()">Save paycheck</button>`);
  setTimeout(() => { const a = document.getElementById('rp_amt'); if (a) a.select(); }, 30);
}
function saveRecordPaycheck(){
  const date = document.getElementById('rp_date').value, amount = round2(+document.getElementById('rp_amt').value || 0);
  if (!date || !amount) { toast('Enter the date and amount.'); return; }
  S.paychecks.push({id:uid(), date, amount, source:document.getElementById('rp_src').value.trim() || 'Paycheck', note:''});
  closeModal(); save(); render(); doneUndo(`Paycheck of ${fmt(amount)} recorded.`);
}
function payScheduleCard(){
  const ps = S.settings.pay || {freq:'biweekly', anchor:'', amount:0, source:''};
  const up = ps.anchor ? payDates(today(), addDays(today(), 120)).slice(0, 8) : [];
  const per = {}; up.forEach(d => { per[monthKey(d)] = payDates(monthStart(monthKey(d)), monthEnd(monthKey(d))).length; });

      <label class="field">A recent payday<input type="date" id="ps_anchor" value="${ps.anchor || ''}"></label>
      <label class="field">Usual take-home (blank = average)<input type="number" step="0.01" id="ps_amt" value="${+ps.amount || ''}" placeholder="${typicalPay() ? fmt(typicalPay()) : '0.00'}" style="width:150px"></label>
      <label class="field">Gross pay per check (before taxes)<input type="number" step="0.01" id="ps_gross" value="${+ps.gross || ''}" placeholder="for % of pay" style="width:150px"></label>
      <label class="field" style="flex:1 1 140px">From<input id="ps_src" value="${esc(ps.source || '')}" placeholder="Employer"></label>
      <button class="btn primary" onclick="savePaySchedule()">Save</button></div>
    ${up.length ? `<div class="mt small"><b>Next paydays:</b> ${up.map(d => fmtDate(d, false)).join(' · ')}</div>
      ${three.length ? `<div class="note info mt" style="margin-bottom:0">📅 ${three.join(', ')} ${three.length > 1 ? 'have' : 'has'} <b>three paychecks</b>.</div>` : ''}` : '<div class="muted small mt">Set a recent payday so the app knows when each paycheck lands.</div>'}</div>`;
}
function savePaySchedule(){

  if (!anchor) { toast('Pick a recent payday.'); return; }
  S.settings.pay = {freq:document.getElementById('ps_freq').value, anchor, amount:round2(+document.getElementById('ps_amt').value || 0), gross:round2(+document.getElementById('ps_gross').value || 0), source:document.getElementById('ps_src').value.trim()};

/* ============================== Monthly Sheet (the spreadsheet, inside the app) ============================== */
/*
 * Laid out like the owner's budget sheet: a summary block, paychecks (what each one covers — the old "Calculator"),
 * then a section per category with line items: Estimated · Actual · Difference · Due. Actuals can be typed in directly.
 */
const isManual = t => !t.account;            // typed in (or loaded from the sheet), not imported from a statement
function entriesIn(p, pred){ return S.transactions.filter(t => t.date >= p.start && t.date <= p.end && pred(t)); }
/** Line items for one category in one month. */
function sheetLines(c, p){
  const lines = [], used = new Set();
  const take = list => { list.forEach(t => used.add(t.id)); return list; };
  const amtOf = list => round2(list.reduce((s, t) => s + (c.kind === 'transfer' ? -t.amount : spendOf(t) || -t.amount), 0));
  if (c.kind === 'transfer' && c.id === saveCatId()) {
    for (const g of S.goals.filter(g => !g.fromPaycheck)) {
      const terms = termsOf(g.matchText).concat(g.name.toLowerCase());
      const list = take(entriesIn(p, t => !used.has(t.id) && t.category === c.id && terms.some(k => t.desc.toLowerCase().includes(k))));
      lines.push({key:'g:' + g.id, name:g.name, est:+g.perCycle || 0, list, actual:amtOf(list), desc:g.name, date:p.start, kind:'save'});
    }
  }
  for (const b of S.bills.filter(b => b.categoryId === c.id)) {
    const dues = billDates(b, p.start, p.end); if (!dues.length && !entriesIn(p, t => t.category === c.id && termsOf(b.match || b.name).some(k => t.desc.toLowerCase().includes(k))).length) continue;
    const f = billFor(b, p.key), terms = termsOf(b.match || b.name);
    const list = take(entriesIn(p, t => !used.has(t.id) && (t.category === c.id || !t.category) && terms.some(k => t.desc.toLowerCase().includes(k))));
    const ap = dues.length && autopayApplies(b, p.key) && !list.length ? catName(b.paidWith) : '';
    lines.push({key:'b:' + b.id, name:b.name, est: dues.length ? f.amount * dues.length : 0, due: dues.length ? ordinal(+dues[0].slice(8)) : (b.freq === 'yearly' ? 'yearly' : ''), list, actual: ap ? round2(f.amount * dues.length) : amtOf(list), desc:b.name, date: dues[0] || p.start, bill:b, autopay:ap});
  }
  if (c.id === debtCatId()) for (const d of S.debts.filter(d => !S.bills.some(b => b.id === d.billId))) {
    const terms = termsOf(d.match).concat(d.name.toLowerCase());
    const list = take(entriesIn(p, t => !used.has(t.id) && t.category === c.id && terms.some(k => t.desc.toLowerCase().includes(k))));
    if (debtBalance(d) <= 0 && !list.length) continue;
    lines.push({key:'d:' + d.id, name:d.name, est:+d.minPayment || 0, due: d.dueDay ? ordinal(d.dueDay) : '', list, actual:amtOf(list), desc:d.name, date: d.dueDay ? `${p.key}-${pad(Math.min(d.dueDay, +p.end.slice(8)))}` : p.start, debt:d});
  }
  // everything else in this category, grouped by description
  const rest = {};
  for (const t of entriesIn(p, t => !used.has(t.id) && parts(t).some(x => x.category === c.id))) {
    const nm = t.account ? displayName(t.desc) : t.desc.trim(), k = (t.account ? 'i:' : '') + nm.toLowerCase();
    (rest[k] ||= {name:nm, list:[]}).list.push(t);
  }
  for (const [k, r] of Object.entries(rest)) {
    const actual = round2(r.list.reduce((s, t) => s + parts(t).filter(x => x.category === c.id).reduce((a, x) => a + (c.kind === 'transfer' ? -x.amount : partSpend(x)), 0), 0));
    lines.push({key:'x:' + k, name:esc(r.name) + (r.list.length > 1 && k.startsWith('i:') ? ` <span class="muted small">×${r.list.length}</span>` : ''), nameHTML:true, est:null, list:r.list, actual, desc:r.name, date:r.list[0].date});
  }
  // A card: show which autopay bills are inside its total (and take them out, like periodStats does)
  if (isCardCat(c)) {
    const st = periodStats(p), ap = (st.autopay || {})[c.id] || [];
    if (ap.length) {
      const raw = lines.reduce((s, l) => s + l.actual, 0), A = ap.reduce((s, x) => s + x.amount, 0), cut = Math.min(Math.max(0, raw), A);
      lines.push({key:'ap:' + c.id, name:`Autopay bills inside this total: ${ap.map(x => x.bill.name + ' ' + fmt(x.amount)).join(', ')}`, est:null, list:[], actual:-round2(cut), autopayLine:true, note: cut < A ? `card total not entered yet — ${fmt(A - cut)} counted under the bills` : 'counted under each bill instead'});
    }
  }
  return lines;
}
const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th');

/** Type an Actual into the sheet: replaces this line's typed-in amount for the month (imported transactions are never touched). */
function setLineActual(lid, value){

/** Calculator-style: what each paycheck has to cover before the next one, and what's left. */
function paycheckBreakdown(p, closed){
  const days = monthPaydays(p.key);
  if (!days.length) return `<div class="card"><h3 style="margin:0 0 6px">Paychecks</h3><div class="muted small">${st0(p)} <a href="#" onclick="go('pay');return false">Set your pay schedule</a> to see what each paycheck needs to cover.</div></div>`;
  const prevDay = payDates(addDays(p.start, -20), addDays(p.start, -1)).pop();
  const windows = [...(prevDay ? [{date:prevDay, prev:true}] : []), ...days];
  const items = [];
  for (const x of billsInRange(p.start, p.end)) items.push({date:x.due, name:x.bill.name + (x.autopay ? ` (on ${x.autopay})` : ''), amount:x.amount, paid:!!x.paid});
  for (const d of S.debts.filter(d => d.dueDay && !S.bills.some(b => b.id === d.billId) && debtBalance(d) > 0)) items.push({date:`${p.key}-${pad(Math.min(d.dueDay, +p.end.slice(8)))}`, name:d.name, amount:+d.minPayment || 0});
  const saveTotal = S.goals.reduce((s, g) => s + planSaving(g), 0), perCheck = days.length ? saveTotal / days.length : 0;
  const rows = windows.map((w, i) => {
    const next = windows[i + 1] ? windows[i + 1].date : addDays(p.end, 1);
    const cov = items.filter(it => it.date >= (i === 0 && w.prev ? p.start : w.date) && it.date < next && (w.prev || it.date >= w.date)).sort((a, b) => a.date.localeCompare(b.date));
    const covTot = cov.reduce((s, it) => s + it.amount, 0), sav = w.prev ? 0 : perCheck;
    return {w, cov, covTot, sav, left: w.prev ? null : round2(w.amount - covTot - sav)};
  }).filter(r => !r.w.prev || r.cov.length);
  return `<div class="card" style="padding:8px"><h3 style="padding:6px 8px 0;margin:0 0 6px">Paychecks <span class="muted small" style="font-weight:400">· ${PAY_FREQ[(S.settings.pay || {}).freq] || ''} · ${days.length} this month</span></h3>
    <div class="tablewrap"><table class="tbl" style="min-width:620px"><thead><tr><th>Payday</th><th class="right">Amount</th><th>Covers (bills & debts due before the next check)</th><th class="right">Savings</th><th class="right">Left from this check</th></tr></thead><tbody>
    ${rows.map(r => `<tr>
      <td style="white-space:nowrap">${fmtDate(r.w.date, false)}${r.w.prev ? '<div class="sub">last month’s check</div>' : ''}</td>
      <td class="num">${r.w.prev ? '' : r.w.rec ? `<b>${fmt(r.w.amount)}</b><div class="sub">received</div>` : `${fmt(r.w.amount)}<div class="sub">expected</div>${closed ? '' : `<button class="btn small noprint" onclick="recordPaycheck('${r.w.date}')">Record</button>`}`}
        ${r.w.prev || closed ? '' : `<button class="btn small noprint" style="margin-top:4px" onclick="openCalc('${r.w.date}')" title="Plan this paycheck">🧮 Plan</button>`}</td>
      <td class="small">${r.cov.map(it => `${it.paid ? '✓ ' : ''}${esc(it.name)} <span class="muted">${fmt(it.amount)} · ${ordinal(+it.date.slice(8))}</span>`).join('<br>') || '<span class="muted">nothing due</span>'}${r.cov.length ? `<div><b>${fmt(r.covTot)}</b></div>` : ''}</td>
      <td class="num">${r.sav ? fmt(r.sav) : ''}</td>
      <td class="num">${r.left == null ? '' : `<b class="${r.left < 0 ? 'neg' : ''}">${fmt(r.left)}</b>`}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="muted small" style="padding:4px 8px">"Left" is what's free for cards and everyday spending after that check's bills and its share of savings (${fmt(saveTotal)} a month split across ${days.length} checks).</div></div>`;
}
const st0 = p => '';

/* ============================== Paycheck calculator (pop-up; replaces the sheet's "Calculator" tab) ============================== */
/*
 * For one paycheck: what's owed on each card, each debt (minimum paid already? add extra), bills due before the next
 * paycheck (already-paid ones show ✓), savings — and what's left of the check. Knows what earlier checks this month paid.
 * "Record these payments" turns the plan into the month's actual entries.
 */
let CALC = null;
function calcDefaultPayday(){
  const near = payDates(addDays(today(), -16), addDays(today(), 3));
  return near.length ? near[near.length - 1] : today();
}
function openCalc(payday){
  const pd = payday || calcDefaultPayday();
  CALC = {payday:pd};
  drawCalc();
}
function drawCalc(){
  const pd = CALC.payday, k = monthKey(pd), p = monthPeriod(k), st = periodStats(p);
  const nextPd = payDates(addDays(pd, 1), addDays(pd, 40))[0] || addDays(pd, 14);
  const rec = S.paychecks.find(x => Math.abs(daysBetween(x.date, pd)) <= 4);
  const amount = CALC.amount != null ? CALC.amount : rec ? +rec.amount : typicalPay();
  const debtBillIds = new Set(S.debts.map(d => d.billId).filter(Boolean));
  const inWindow = d => d < nextPd;                     // due before the next paycheck (incl. anything overdue)
  const rows = {cards:[], debts:[], bills:[], save:[]};
  // Credit cards
  const bal = S.settings.cardBal || {};
  for (const c of cardCats()) {
    const paidMonth = entriesIn(p, t => parts(t).some(x => x.category === c.id)).reduce((s, t) => s - t.amount, 0);
    const ap = (st.autopay || {})[c.id] || [];
    const last = bal[c.id] || {};
    rows.cards.push({key:'c:' + c.id, name:c.name, cat:c.id, paidMonth, ap, balance: last.month === k ? last.amount : '', pay: last.month === k && last.amount ? Math.max(0, round2(last.amount)) : 0});
  }
  // Debts (minimum this month: paid already? → extra field)
  for (const d of S.debts.filter(d => debtBalance(d) > 0)) {
    // paid this month: payments the debt already knows about, or (if it has no match text) entries named after it
    const byName = entriesIn(p, t => t.amount < 0 && t.desc.toLowerCase().includes(d.name.toLowerCase().split(' (')[0])).reduce((s, t) => s - t.amount, 0);
    const paid = Math.max(debtPaidIn(d, p), round2(byName)), min = +d.minPayment || 0, minPaid = min > 0 && (paid >= min - 0.01 || (d.paidMonths || []).includes(k));
    const due = d.dueDay ? `${k}-${pad(Math.min(d.dueDay, +p.end.slice(8)))}` : '';
    const dueNow = !minPaid && (!due || inWindow(due));
    rows.debts.push({key:'d:' + d.id, name:d.name, debt:d, balance:debtBalance(d), min, paid, minPaid, due, pay: dueNow ? round2(Math.max(0, min - paid)) : 0});
  }
  // Bills (not debt payments, not autopay-to-card) due before the next check
  for (const x of billsInRange(p.start, p.end)) {
    if (debtBillIds.has(x.bill.id) || x.autopay) continue;
    if (!inWindow(x.due) && !x.paid) { rows.bills.push({key:'b:' + x.bill.id + x.due, name:x.bill.name, bill:x.bill, due:x.due, amount:x.amount, later:true, pay:0}); continue; }
    rows.bills.push({key:'b:' + x.bill.id + x.due, name:x.bill.name, bill:x.bill, due:x.due, amount:x.amount, paid:x.paid, pay: x.paid ? 0 : x.amount});
  }
  // Savings: what's left of this month's plan, split over the checks still to come this month
  const checksLeft = Math.max(1, payDates(pd, p.end).length);
  for (const g of S.goals.filter(g => !g.fromPaycheck && +g.perCycle > 0 && !goalForecast(g).done)) {
    const saved = goalSavedIn(g, p), left = Math.max(0, +g.perCycle - saved);
    rows.save.push({key:'g:' + g.id, name:g.name, goal:g, saved, plan:+g.perCycle, pay: round2(left / checksLeft)});
  }
  CALC.rows = rows; CALC.k = k;
  const otherDays = payDates(addDays(pd, -45), addDays(pd, 45));
  const inp = (key, val, extra = '') => `<input type="number" step="0.01" min="0" class="calc-in" data-key="${key}" value="${val ? round2(val) : ''}" placeholder="0.00" oninput="calcUpdate()" ${extra}>`;
  const sec = (title, list, body) => list.length ? `<h3 class="calc-h">${title}</h3><div class="tablewrap"><table class="tbl calc">${body}</table></div>` : '';
  openModal(`🧮 Paycheck calculator`, `
    <div class="row" style="margin-bottom:6px">
      <label class="field">Payday<select onchange="CALC={payday:this.value};drawCalc()">${otherDays.map(d => `<option value="${d}" ${d === pd ? 'selected' : ''}>${fmtDate(d)}${S.paychecks.some(x => Math.abs(daysBetween(x.date, d)) <= 4) ? ' ✓' : ''}</option>`).join('')}${otherDays.includes(pd) ? '' : `<option value="${pd}" selected>${fmtDate(pd)}</option>`}</select></label>
      <label class="field">Paycheck amount<input type="number" step="0.01" id="calc-amt" value="${amount || ''}" placeholder="0.00" oninput="CALC.amount=+this.value||0;calcUpdate()" style="width:140px;font-size:16px;font-weight:600"></label>
      <div class="muted small" style="padding-bottom:8px">${rec ? '✓ received' : 'not recorded yet'} · covers bills due through ${fmtDate(addDays(nextPd, -1), false)} (next payday ${fmtDate(nextPd, false)})</div>
    </div>
    ${sec('Credit cards', rows.cards, `<thead><tr><th>Card</th><th class="right">Paid this month</th><th class="right">Balance now</th><th class="right">Pay from this check</th></tr></thead><tbody>
      ${rows.cards.map(r => `<tr><td>${esc(r.name)}${r.ap.length ? `<div class="sub">💳 autopay: ${r.ap.map(x => esc(x.bill.name) + ' ' + fmt(x.amount)).join(', ')}</div>` : ''}</td>
        <td class="num">${r.paidMonth ? fmt(r.paidMonth) : '<span class="muted">—</span>'}</td>
        <td class="num"><input type="number" step="0.01" min="0" class="calc-bal" data-key="${r.key}" value="${r.balance === '' ? '' : r.balance}" placeholder="0.00" oninput="calcBal(this)"></td>
        <td class="num">${inp(r.key, r.pay)}</td></tr>`).join('')}</tbody>`)}
    ${sec('Debts', rows.debts, `<thead><tr><th>Debt</th><th class="right">Balance</th><th class="right">Minimum</th><th>This month</th><th class="right">Pay from this check</th></tr></thead><tbody>
      ${rows.debts.map(r => `<tr><td>${esc(r.name)}${r.due ? `<div class="sub">due ${fmtDate(r.due, false)}</div>` : ''}</td><td class="num">${fmt(r.balance)}</td><td class="num">${r.min ? fmt(r.min) : '—'}</td>
        <td class="small">${(ds => ds.state === 'unpaid' && !ds.pastDue && r.due && !inWindow(r.due) ? '<span class="muted">due after next check</span>' : debtStatusHTML(ds))(debtMonthStatus(r.debt, p))}</td>
        <td class="num">${inp(r.key, r.pay)}${r.minPaid ? '<div class="sub">extra payment</div>' : ''}</td></tr>`).join('')}</tbody>`)}
    ${sec('Bills', rows.bills, `<thead><tr><th>Bill</th><th>Due</th><th class="right">Amount</th><th class="right">Pay from this check</th></tr></thead><tbody>
      ${rows.bills.map(r => `<tr${r.paid || r.later ? ' style="opacity:.65"' : ''}><td>${esc(r.name)}</td><td class="small">${fmtDate(r.due, false)}</td><td class="num">${fmt(r.amount)}</td>
        <td class="num">${r.paid ? '<span class="status paid">✓ Paid</span>' : r.later ? `<span class="muted small">next check</span> ${inp(r.key, 0, 'style="width:80px"')}` : inp(r.key, r.pay)}</td></tr>`).join('')}</tbody>`)}
    ${sec('Savings', rows.save, `<thead><tr><th>Account</th><th class="right">Saved this month</th><th class="right">Monthly plan</th><th class="right">Put in from this check</th></tr></thead><tbody>
      ${rows.save.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${fmt(r.saved)}</td><td class="num">${fmt(r.plan)}</td><td class="num">${inp(r.key, r.pay)}</td></tr>`).join('')}</tbody>`)}
    <div class="calc-out"><div><span>Paycheck</span><b id="calc-o-amt"></b></div><div><span>Paying out</span><b id="calc-o-out"></b></div><div class="big"><span>Remaining from this paycheck</span><b id="calc-left"></b></div></div>
    <div class="muted small mt">Nothing is saved until you press <b>Record these payments</b>. Then each amount becomes an entry for ${monthName(k)} (debt balances and savings update too).</div>`,
    `<span class="calc-foot">Left from this check <b id="calc-left2"></b></span><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="calcRecord()">Record these payments</button>`, true);
  calcUpdate();
}
function calcBal(el){
  const v = +el.value || 0, payEl = document.querySelector(`.calc-in[data-key="${el.dataset.key}"]`);
  if (payEl && (!payEl.dataset.touched)) payEl.value = v ? round2(v) : '';
  calcUpdate();
}
function calcUpdate(){
  document.querySelectorAll('.calc-in').forEach(el => { if (document.activeElement === el) el.dataset.touched = '1'; });
  const amt = CALC.amount != null ? CALC.amount : (+(document.getElementById('calc-amt') || {}).value || 0);
  let out = 0; document.querySelectorAll('.calc-in').forEach(el => { out += Math.max(0, +el.value || 0); });
  const left = round2(amt - out), L = document.getElementById('calc-left');
  if (!L) return;
  document.getElementById('calc-o-amt').textContent = fmt(amt);
  document.getElementById('calc-o-out').textContent = fmt(out);
  L.textContent = fmt(left); L.className = left < 0 ? 'neg' : 'pos';
  const L2 = document.getElementById('calc-left2'); if (L2) { L2.textContent = fmt(left); L2.className = left < 0 ? 'neg' : 'pos'; } // always visible next to the buttons
}
function calcRecord(){
  const pd = CALC.payday, k = CALC.k, amt = +(document.getElementById('calc-amt').value) || 0;
  const val = key => round2(Math.max(0, +((document.querySelector(`.calc-in[data-key="${key}"]`) || {}).value) || 0));
  // Entries are dated on the paycheck (bills on their due date, debts on theirs if later) — so planning a future check works too
  const clamp = d => d < monthStart(k) ? monthStart(k) : d > monthEnd(k) ? monthEnd(k) : d;
  const d0 = clamp(pd);
  const dupSkip = [];
  const add = (desc, cat, a, when) => {
    const t = {id:uid(), date:clamp(when || pd), desc, amount:-a, category:cat, account:'', note:`Paycheck calculator (${fmtDate(pd, false)} check)`, hash:'manual-' + uid()};
    if (importedTwin(t)) { dupSkip.push(desc); return false; }   // already in an imported statement
    S.transactions.push(t); return true;
  };
  let n = 0, total = 0;
  const R = CALC.rows;
  // remember card balances for this month
  S.settings.cardBal ||= {};
  document.querySelectorAll('.calc-bal').forEach(el => { const cat = el.dataset.key.slice(2); if (el.value !== '') S.settings.cardBal[cat] = {amount:round2(+el.value || 0), month:k, date:today()}; });
  for (const r of R.cards) { const a = val(r.key); if (a) { if (add(r.name, r.cat, a)) { n++; total += a; } } }
  for (const r of R.debts) { const a = val(r.key); if (a) {
    const d = r.debt; if (!termsOf(d.match).some(m => d.name.toLowerCase().includes(m))) d.match = [d.match, d.name.toLowerCase()].filter(Boolean).join('|');
    if (add(d.name, debtCatId(), a, r.due && r.due > pd ? r.due : pd)) { n++; total += a; } } }
  for (const r of R.bills) { const a = val(r.key); if (a) { if (add(r.bill.name, r.bill.categoryId || '', a, r.due)) { n++; total += a; } } }
  for (const r of R.save) { const a = val(r.key); if (a) {
    const g = r.goal; if (!termsOf(g.matchText).some(m => g.name.toLowerCase().includes(m))) g.matchText = [g.matchText, g.name.toLowerCase()].filter(Boolean).join('|');
    if (g.startDate > d0) g.startDate = d0;
    if (add(g.name, saveCatId(), a)) { n++; total += a; } } }
  // record the paycheck itself once payday has arrived (a future one stays "expected")
  if (amt && pd <= today() && !S.paychecks.some(x => Math.abs(daysBetween(x.date, pd)) <= 4)) S.paychecks.push({id:uid(), date:pd, amount:round2(amt), source:(S.settings.pay || {}).source || 'Paycheck', note:'Paycheck calculator'});
  closeModal(); CALC = null; save(); render();
  doneUndo(`Recorded ${n} payment${n === 1 ? '' : 's'} (${fmt(total)}) from the ${fmtDate(pd, false)} paycheck${amt ? ` — ${fmt(round2(amt - total))} left` : ''}.${dupSkip.length ? ` Skipped ${dupSkip.length} already in your imported statements (${dupSkip.map(esc).join(', ')}).` : ''}`);
}

/* ---------- speed: reuse heavy results until the data changes (LAST = JSON of the last saved state) ---------- */
function memoByData(fn){
  let key = null, val;
  return (...args) => {
    if (args.length) return fn(...args);
    if (key !== null && key === LAST) return val;
    val = fn(); key = LAST; return val;
  };
}
findRecurring = memoByData(findRecurring);
findTransferPairs = memoByData(findTransferPairs);
learnedMap = memoByData(learnedMap);

/* ============================== boot ============================== */
let lastActive = Date.now();
['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { lastActive = Date.now(); }, {passive:true}));
/* With a password set, lock automatically after 15 minutes without activity. */
setInterval(() => { if (KEY && !LOCKED && Date.now() - lastActive > 15 * 60 * 1000) lockNow(); }, 30000);
/* ---------- "What's new": shown once after an update (S.settings.seenNews = the last one seen) ---------- */
const NEWS_ID = '2026-10-21';
const NEWS = [
  ['＋', 'Add amounts faster', 'The <b>＋ Add</b> button (or press <kbd>N</kbd>) works from any page: type the amount, tap a category. Press <kbd>?</kbd> for all keyboard shortcuts.'],
  ['🛒', 'Category icons', 'Every category has an icon. Click it on the Budget page to pick a different one or change its color.'],
  ['🍩', 'Where it went', 'The Month page has a spending donut and your recent activity.'],
  ['📅', 'Bills calendar', 'The Bills page shows the month as a calendar: what\'s paid, what\'s due, and your paydays.'],
  ['🏷️', 'Cleaner names', '“POS Withdrawal - Circlek #1234 …” now shows as <b>Circle K</b>. Transactions are grouped by day, and the Monthly Sheet groups them by store.'],
  ['💳', 'Cards cover categories', 'Budget page → under a card, <b>pick what it covers</b> (e.g. Meijer → Groceries, Gas).'],
  ['🌓', 'Light or dark', 'The 🌓 button at the top switches between following Windows, light, and dark.'],
  ['🏁', 'Debt payoff dates', 'Each debt shows when it\'s paid off at its minimum. 401(k)s can be a percent of pay.'],
];
function showNews(force){
  if (!force && (S.settings.seenNews === NEWS_ID || !S.transactions.length)) return;
  openModal("What's new in Budget Buddy", `<div class="news">${NEWS.map(([i, t, d]) => `<div class="newsrow"><span class="ni" aria-hidden="true">${i}</span><div><b>${t}</b><div class="muted small">${d}</div></div></div>`).join('')}</div>`,
    `<button class="btn primary" onclick="S.settings.seenNews=NEWS_ID;save();closeModal()">Got it</button>`);
}
function startApp(){
  resetUndo();
  document.body.classList.add('ready');
  if (KEY) { const q = document.getElementById('quitBtn'); q.insertAdjacentHTML('beforebegin', `<button class="btn small" onclick="lockNow()" title="Lock the app (needs your password to open again)">🔒 Lock</button>`); }
  if (MODE === 'server') { setStatus(KEY ? 'Encrypted · saving to drive' : 'Saving to drive'); document.getElementById('quitBtn').style.display = 'inline-block'; }
  const h = location.hash.slice(1);
  if (TABS.some(x => x[0] === h)) TAB = h;
  render();
  setTimeout(() => showNews(), 400);
}
(async function(){
  await load();
  if (MODE !== 'server') {
    const b = document.getElementById('banner');
    b.style.display = 'block';
    b.innerHTML = 'Opened without the USB helper — data is saved in this browser only. Use <b>Start Budget Buddy.bat</b> to save to your drive. <a href="#" onclick="go(\'settings\');return false">More info</a>';
    setStatus('Browser storage');
  }
  if (LOCKED) showLockScreen(); else startApp();
})();
</script>
